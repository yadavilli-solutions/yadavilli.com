<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="ps-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#34d399"/>
    </marker>
    <marker id="ps-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#fbbf24"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="580" fill="#09090b" rx="12"/>

  <!-- Title -->
  <text x="480" y="34" fill="#e4e4e7" font-size="15" font-weight="600" text-anchor="middle" letter-spacing="0.3">AI Pattern Shape: Skill Depth × Action Breadth</text>
  <text x="480" y="53" fill="#71717a" font-size="11" text-anchor="middle">nine patterns · each chip shows its primitive verb (the operation it performs)</text>

  <!-- Quadrant fills -->
  <rect x="141" y="64" width="338" height="198" fill="#052e16" opacity="0.28"/>
  <rect x="481" y="64" width="338" height="198" fill="#1c1917" opacity="0.4"/>
  <rect x="141" y="264" width="338" height="198" fill="#1e1b4b" opacity="0.28"/>
  <rect x="481" y="264" width="338" height="198" fill="#7f1d1d" opacity="0.2"/>

  <!-- Dividing lines -->
  <line x1="140" y1="263" x2="820" y2="263" stroke="#3f3f46" stroke-width="1.5" stroke-dasharray="8,5"/>
  <line x1="480" y1="63" x2="480" y2="463" stroke="#3f3f46" stroke-width="1.5" stroke-dasharray="8,5"/>

  <!-- Axes -->
  <line x1="140" y1="59" x2="140" y2="465" stroke="#52525b" stroke-width="1.5"/>
  <line x1="138" y1="463" x2="822" y2="463" stroke="#52525b" stroke-width="1.5"/>
  <polygon points="140,57 136,67 144,67" fill="#52525b"/>
  <polygon points="824,463 814,459 814,467" fill="#52525b"/>

  <!-- Axis labels -->
  <text transform="translate(24,263) rotate(-90)" fill="#a1a1aa" font-size="13" font-weight="500" text-anchor="middle">Skill Depth</text>
  <text x="480" y="535" fill="#a1a1aa" font-size="13" font-weight="500" text-anchor="middle">Action Breadth  (scope · duration · steps)</text>
  <text x="128" y="467" fill="#52525b" font-size="11" text-anchor="end">Low</text>
  <text x="128" y="75" fill="#52525b" font-size="11" text-anchor="end">High</text>
  <text x="148" y="481" fill="#52525b" font-size="11" text-anchor="start">Narrow</text>
  <text x="812" y="481" fill="#52525b" font-size="11" text-anchor="end">Broad</text>

  <!-- Quadrant names -->
  <text x="310" y="86" fill="#6ee7b7" font-size="12" font-weight="700" text-anchor="middle" opacity="0.6" letter-spacing="2">SPECIALIST</text>
  <text x="650" y="86" fill="#fbbf24" font-size="12" font-weight="700" text-anchor="middle" opacity="0.6" letter-spacing="2">AGENT</text>
  <text x="310" y="286" fill="#818cf8" font-size="12" font-weight="700" text-anchor="middle" opacity="0.6" letter-spacing="2">FEATURE</text>
  <text x="650" y="286" fill="#f87171" font-size="12" font-weight="700" text-anchor="middle" opacity="0.7" letter-spacing="2">NOISE</text>

  <!-- ===== SPECIALIST chips (4) ===== -->
  <rect x="158" y="104" width="142" height="40" rx="6" fill="#052e16" stroke="#10b981" stroke-width="1.3"/>
  <text x="229" y="121" fill="#6ee7b7" font-size="12.5" font-weight="600" text-anchor="middle">Oracle</text>
  <text x="229" y="135" fill="#3d8c6e" font-size="9.5" text-anchor="middle">answer</text>
  <rect x="310" y="104" width="142" height="40" rx="6" fill="#052e16" stroke="#10b981" stroke-width="1.3"/>
  <text x="381" y="121" fill="#6ee7b7" font-size="12.5" font-weight="600" text-anchor="middle">Watchdog</text>
  <text x="381" y="135" fill="#3d8c6e" font-size="9.5" text-anchor="middle">monitor</text>
  <rect x="158" y="152" width="142" height="40" rx="6" fill="#052e16" stroke="#10b981" stroke-width="1.3"/>
  <text x="229" y="169" fill="#6ee7b7" font-size="12.5" font-weight="600" text-anchor="middle">Transformer</text>
  <text x="229" y="183" fill="#3d8c6e" font-size="9.5" text-anchor="middle">transform</text>
  <rect x="310" y="152" width="142" height="40" rx="6" fill="#052e16" stroke="#10b981" stroke-width="1.3"/>
  <text x="381" y="169" fill="#6ee7b7" font-size="12" font-weight="600" text-anchor="middle">Artifact Gen.</text>
  <text x="381" y="183" fill="#3d8c6e" font-size="9.5" text-anchor="middle">generate</text>

  <!-- ===== AGENT chips (3) ===== -->
  <rect x="500" y="104" width="142" height="40" rx="6" fill="#1c1917" stroke="#f59e0b" stroke-width="1.3"/>
  <text x="571" y="121" fill="#fcd34d" font-size="12.5" font-weight="600" text-anchor="middle">Autopilot</text>
  <text x="571" y="135" fill="#92702e" font-size="9.5" text-anchor="middle">execute</text>
  <rect x="652" y="104" width="142" height="40" rx="6" fill="#1c1917" stroke="#f59e0b" stroke-width="1.3"/>
  <text x="723" y="121" fill="#fcd34d" font-size="12.5" font-weight="600" text-anchor="middle">Persona</text>
  <text x="723" y="135" fill="#92702e" font-size="9.5" text-anchor="middle">converse</text>
  <rect x="576" y="160" width="148" height="40" rx="6" fill="#1c1917" stroke="#f59e0b" stroke-width="1.3"/>
  <text x="650" y="177" fill="#fcd34d" font-size="12.5" font-weight="600" text-anchor="middle">Sandbox</text>
  <text x="650" y="191" fill="#92702e" font-size="9.5" text-anchor="middle">simulate</text>

  <!-- ===== FEATURE chips (2) ===== -->
  <rect x="200" y="316" width="130" height="40" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.3"/>
  <text x="265" y="333" fill="#a5b4fc" font-size="12.5" font-weight="600" text-anchor="middle">Copilot</text>
  <text x="265" y="347" fill="#6d6a9c" font-size="9.5" text-anchor="middle">generate</text>
  <rect x="342" y="316" width="130" height="40" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.3"/>
  <text x="407" y="333" fill="#a5b4fc" font-size="12.5" font-weight="600" text-anchor="middle">Lookup</text>
  <text x="407" y="347" fill="#6d6a9c" font-size="9.5" text-anchor="middle">retrieve</text>
  <text x="310" y="392" fill="#4c4b7a" font-size="10.5" text-anchor="middle">lowest trust · fastest to ship · where every product starts</text>

  <!-- ===== NOISE ===== -->
  <text x="650" y="332" fill="#fca5a5" font-size="22" text-anchor="middle" opacity="0.5">×</text>
  <text x="650" y="362" fill="#f87171" font-size="11.5" font-weight="600" text-anchor="middle" opacity="0.85">Not a pattern — a trap</text>
  <text x="650" y="380" fill="#b45454" font-size="10" text-anchor="middle">breadth without depth — drift, abandonment</text>

  <!-- ===== Progression arrows ===== -->
  <!-- deepen skill: Feature -> Specialist (vertical, clear lane at x=130/left inside) -->
  <line x1="466" y1="356" x2="466" y2="200" stroke="#34d399" stroke-width="1.4" marker-end="url(#ps-green)" opacity="0.7"/>
  <text x="474" y="290" fill="#34d399" font-size="9.5" font-weight="600" text-anchor="start" opacity="0.85">1 · deepen</text>
  <text x="474" y="303" fill="#34d399" font-size="9.5" font-weight="600" text-anchor="start" opacity="0.85">skill</text>
  <!-- expand breadth: Specialist -> Agent (horizontal, top lane y~96) -->
  <circle cx="466" cy="200" r="2.5" fill="#34d399" opacity="0.7"/>
  <line x1="466" y1="100" x2="497" y2="100" stroke="#fbbf24" stroke-width="1.4" marker-end="url(#ps-amber)" opacity="0.7"/>
  <line x1="466" y1="200" x2="466" y2="100" stroke="#34d399" stroke-width="1.4" opacity="0.45" stroke-dasharray="3,3"/>
  <text x="455" y="92" fill="#fbbf24" font-size="9.5" font-weight="600" text-anchor="end" opacity="0.85">2 · expand breadth</text>

  <!-- Footer -->
  <text x="480" y="498" fill="#a1a1aa" font-size="11" font-weight="600" text-anchor="middle">Build order: Feature → Specialist → Agent</text>
  <text x="480" y="514" fill="#71717a" font-size="10" text-anchor="middle">deepen skill in a narrow domain before expanding breadth · skip Specialist and you land in Noise</text>
</svg>
