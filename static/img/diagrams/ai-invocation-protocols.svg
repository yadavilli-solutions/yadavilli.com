<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="conn" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#71717a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" fill="#02023e" rx="12"/>

  <!-- Title -->
  <text x="450" y="36" fill="#e4e4e7" font-size="15" font-weight="600" text-anchor="middle" letter-spacing="0.4">Invocation Protocol: How AI Gets Triggered Changes Everything</text>

  <!-- Column backgrounds -->
  <!-- Pull: indigo -->
  <rect x="55" y="56" width="184" height="280" rx="8" fill="#1e1b4b" opacity="0.35" stroke="#4338ca" stroke-width="1"/>
  <!-- Poll: cyan -->
  <rect x="259" y="56" width="184" height="280" rx="8" fill="#0c2a4a" opacity="0.45" stroke="#0e7490" stroke-width="1"/>
  <!-- Push: amber -->
  <rect x="463" y="56" width="184" height="280" rx="8" fill="#1c1917" opacity="0.5" stroke="#b45309" stroke-width="1"/>
  <!-- Ambient: red -->
  <rect x="667" y="56" width="184" height="280" rx="8" fill="#450a0a" opacity="0.35" stroke="#dc2626" stroke-width="1"/>

  <!-- Column headers: mode names -->
  <text x="147" y="82" fill="#a5b4fc" font-size="16" font-weight="700" text-anchor="middle">Pull</text>
  <text x="351" y="82" fill="#3fe3ef" font-size="16" font-weight="700" text-anchor="middle">Poll</text>
  <text x="555" y="82" fill="#fcd34d" font-size="16" font-weight="700" text-anchor="middle">Push</text>
  <text x="759" y="82" fill="#fca5a5" font-size="16" font-weight="700" text-anchor="middle">Ambient</text>

  <!-- Trigger description badges -->
  <rect x="72" y="90" width="150" height="20" rx="4" fill="#312e81" opacity="0.6"/>
  <text x="147" y="104" fill="#818cf8" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="0.5">HUMAN-INITIATED</text>
  <rect x="276" y="90" width="150" height="20" rx="4" fill="#0c3344" opacity="0.8"/>
  <text x="351" y="104" fill="#67e8f9" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="0.5">SCHEDULED / TIME</text>
  <rect x="480" y="90" width="150" height="20" rx="4" fill="#292524" opacity="0.8"/>
  <text x="555" y="104" fill="#fbbf24" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="0.5">EVENT-TRIGGERED</text>
  <rect x="684" y="90" width="150" height="20" rx="4" fill="#5c0404" opacity="0.6"/>
  <text x="759" y="104" fill="#f87171" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="0.5">ALWAYS OBSERVING</text>

  <!-- Divider lines in cards -->
  <line x1="68" y1="118" x2="226" y2="118" stroke="#3f3f46" stroke-width="1" opacity="0.6"/>
  <line x1="272" y1="118" x2="430" y2="118" stroke="#3f3f46" stroke-width="1" opacity="0.6"/>
  <line x1="476" y1="118" x2="634" y2="118" stroke="#3f3f46" stroke-width="1" opacity="0.6"/>
  <line x1="680" y1="118" x2="838" y2="118" stroke="#3f3f46" stroke-width="1" opacity="0.6"/>

  <!-- Description text per column -->
  <text x="147" y="134" fill="#6d6a9c" font-size="10" text-anchor="middle">User invokes · waits for result</text>
  <text x="147" y="148" fill="#6d6a9c" font-size="10" text-anchor="middle">Bounded scope · Easy to audit</text>

  <text x="351" y="134" fill="#0e7490" font-size="10" text-anchor="middle">Runs on schedule · Batch assess</text>
  <text x="351" y="148" fill="#0e7490" font-size="10" text-anchor="middle">Low urgency · Predictable load</text>

  <text x="555" y="134" fill="#92400e" font-size="10" text-anchor="middle">Event fires · AI responds async</text>
  <text x="555" y="148" fill="#92400e" font-size="10" text-anchor="middle">Requires full event sourcing</text>

  <text x="759" y="134" fill="#991b1b" font-size="10" text-anchor="middle">AI proactively surfaces insights</text>
  <text x="759" y="148" fill="#991b1b" font-size="10" text-anchor="middle">Highest trust · Hardest to govern</text>

  <!-- "Fits" label -->
  <text x="147" y="172" fill="#4c4b7a" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="0.5">FITS</text>
  <text x="351" y="172" fill="#155e75" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="0.5">FITS</text>
  <text x="555" y="172" fill="#78350f" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="0.5">FITS</text>
  <text x="759" y="172" fill="#7f1d1d" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="0.5">FITS</text>

  <!-- Pattern chips per column -->
  <!-- Pull: Oracle, Copilot, Transformer(on demand) -->
  <rect x="82" y="180" width="62" height="26" rx="5" fill="#052e16" stroke="#10b981" stroke-width="1"/>
  <text x="113" y="197" fill="#6ee7b7" font-size="10" font-weight="600" text-anchor="middle">Oracle</text>
  <rect x="154" y="180" width="64" height="26" rx="5" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
  <text x="186" y="197" fill="#a5b4fc" font-size="10" font-weight="600" text-anchor="middle">Copilot</text>
  <rect x="82" y="214" width="100" height="26" rx="5" fill="#052e16" stroke="#10b981" stroke-width="1"/>
  <text x="132" y="231" fill="#6ee7b7" font-size="10" font-weight="600" text-anchor="middle">Transformer</text>

  <!-- Poll: Watchdog(batch), Oracle(refresh), Transformer -->
  <rect x="276" y="180" width="88" height="26" rx="5" fill="#052e16" stroke="#10b981" stroke-width="1"/>
  <text x="320" y="197" fill="#6ee7b7" font-size="10" font-weight="600" text-anchor="middle">Watchdog</text>
  <rect x="374" y="180" width="56" height="26" rx="5" fill="#052e16" stroke="#10b981" stroke-width="1"/>
  <text x="402" y="197" fill="#6ee7b7" font-size="10" font-weight="600" text-anchor="middle">Oracle</text>
  <rect x="276" y="214" width="100" height="26" rx="5" fill="#052e16" stroke="#10b981" stroke-width="1"/>
  <text x="326" y="231" fill="#6ee7b7" font-size="10" font-weight="600" text-anchor="middle">Transformer</text>

  <!-- Push: Watchdog, Transformer(pipeline), Autopilot -->
  <rect x="480" y="180" width="88" height="26" rx="5" fill="#052e16" stroke="#10b981" stroke-width="1"/>
  <text x="524" y="197" fill="#6ee7b7" font-size="10" font-weight="600" text-anchor="middle">Watchdog</text>
  <rect x="578" y="180" width="56" height="26" rx="5" fill="#1c1917" stroke="#f59e0b" stroke-width="1"/>
  <text x="606" y="197" fill="#fcd34d" font-size="10" font-weight="600" text-anchor="middle">Autopilot</text>
  <rect x="480" y="214" width="100" height="26" rx="5" fill="#052e16" stroke="#10b981" stroke-width="1"/>
  <text x="530" y="231" fill="#6ee7b7" font-size="10" font-weight="600" text-anchor="middle">Transformer</text>

  <!-- Ambient: Persona, Autopilot(evolved), Oracle(proactive) -->
  <rect x="684" y="180" width="66" height="26" rx="5" fill="#1c1917" stroke="#f59e0b" stroke-width="1"/>
  <text x="717" y="197" fill="#fcd34d" font-size="10" font-weight="600" text-anchor="middle">Persona</text>
  <rect x="760" y="180" width="74" height="26" rx="5" fill="#1c1917" stroke="#f59e0b" stroke-width="1"/>
  <text x="797" y="197" fill="#fcd34d" font-size="10" font-weight="600" text-anchor="middle">Autopilot</text>
  <rect x="684" y="214" width="62" height="26" rx="5" fill="#052e16" stroke="#dc2626" stroke-width="1"/>
  <text x="715" y="231" fill="#fca5a5" font-size="10" font-weight="600" text-anchor="middle">Oracle ▸</text>

  <!-- Breadth effect per column -->
  <text x="147" y="264" fill="#4c4b7a" font-size="10" text-anchor="middle" font-weight="600">Breadth: contained</text>
  <text x="351" y="264" fill="#155e75" font-size="10" text-anchor="middle" font-weight="600">Breadth: predictable</text>
  <text x="555" y="264" fill="#78350f" font-size="10" text-anchor="middle" font-weight="600">Breadth: event surface</text>
  <text x="759" y="264" fill="#991b1b" font-size="10" text-anchor="middle" font-weight="600">Breadth: shifts quadrant</text>

  <text x="147" y="280" fill="#4c4b7a" font-size="10" text-anchor="middle">user sets scope</text>
  <text x="351" y="280" fill="#155e75" font-size="10" text-anchor="middle">time sets scope</text>
  <text x="555" y="280" fill="#78350f" font-size="10" text-anchor="middle">events set scope</text>
  <text x="759" y="280" fill="#b91c1c" font-size="10" text-anchor="middle" font-weight="600">⚠ AI sets scope</text>

  <!-- Governance required bar -->
  <text x="55" y="362" fill="#71717a" font-size="11" font-weight="500">Governance required</text>
  <text x="845" y="362" fill="#71717a" font-size="11" font-weight="500" text-anchor="end">→</text>

  <!-- Bar segments -->
  <rect x="55" y="368" width="184" height="12" rx="3" fill="#312e81" opacity="0.7"/>
  <rect x="259" y="368" width="184" height="12" rx="3" fill="#0c3344" opacity="0.8"/>
  <rect x="463" y="368" width="184" height="12" rx="3" fill="#92400e" opacity="0.8"/>
  <rect x="667" y="368" width="184" height="12" rx="3" fill="#991b1b" opacity="0.9"/>

  <text x="147" y="394" fill="#6d6a9c" font-size="10" text-anchor="middle">Minimal</text>
  <text x="351" y="394" fill="#0e7490" font-size="10" text-anchor="middle">Audit log</text>
  <text x="555" y="394" fill="#b45309" font-size="10" text-anchor="middle">Full event sourcing</text>
  <text x="759" y="394" fill="#dc2626" font-size="10" text-anchor="middle" font-weight="600">Structural governance</text>

  <!-- Key insight callout -->
  <rect x="188" y="416" width="524" height="44" rx="6" fill="#0c0c52" stroke="#3f3f46" stroke-width="1"/>
  <text x="450" y="433" fill="#a1a1aa" font-size="11" font-weight="600" text-anchor="middle">Key insight: invocation protocol shifts quadrant position without changing the underlying model</text>
  <text x="450" y="450" fill="#71717a" font-size="11" text-anchor="middle">An Oracle invoked via Pull = Specialist. The same Oracle running ambient = moving toward Agent — or Noise.</text>

  <!-- Connecting arrows between columns -->
  <line x1="241" y1="165" x2="253" y2="165" stroke="#71717a" stroke-width="1.5" marker-end="url(#conn)"/>
  <line x1="445" y1="165" x2="457" y2="165" stroke="#71717a" stroke-width="1.5" marker-end="url(#conn)"/>
  <line x1="649" y1="165" x2="661" y2="165" stroke="#71717a" stroke-width="1.5" marker-end="url(#conn)"/>
</svg>
