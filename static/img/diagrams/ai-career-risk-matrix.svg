<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 570" font-family="Inter, system-ui, sans-serif">
  <rect width="920" height="570" fill="#09090b" rx="12"/>

  <!-- Title -->
  <text x="460" y="34" fill="#f4f4f5" font-size="17" font-weight="700" text-anchor="middle">The Career Risk Calculus</text>
  <text x="460" y="54" fill="#52525b" font-size="12" text-anchor="middle">What a rational executive optimises when deciding whether to adopt enterprise AI</text>

  <!-- Outer grid border -->
  <rect x="155" y="68" width="750" height="462" fill="none" stroke="#27272a" stroke-width="1" rx="4"/>

  <!-- Column divider -->
  <line x1="530" y1="68" x2="530" y2="530" stroke="#27272a" stroke-width="1"/>
  <!-- Row divider -->
  <line x1="155" y1="295" x2="905" y2="295" stroke="#27272a" stroke-width="1"/>

  <!-- Column header backgrounds -->
  <rect x="155" y="68" width="375" height="32" fill="#18181b" rx="0"/>
  <rect x="530" y="68" width="375" height="32" fill="#18181b" rx="0"/>

  <!-- Column headers -->
  <text x="342" y="89" fill="#a1a1aa" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">AI TURNS OUT TO MATTER</text>
  <text x="717" y="89" fill="#a1a1aa" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">AI DOESN'T MATTER</text>

  <!-- Row label backgrounds -->
  <rect x="0" y="99" width="155" height="196" fill="#18181b" rx="0"/>
  <rect x="0" y="295" width="155" height="235" fill="#18181b" rx="0"/>

  <!-- Row labels (rotated) -->
  <text transform="translate(77,197) rotate(-90)" fill="#a1a1aa" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">YOU ADOPT AI</text>
  <text transform="translate(77,412) rotate(-90)" fill="#a1a1aa" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">YOU DON'T ADOPT</text>

  <!-- Q1: Adopt + Matters → GOOD -->
  <rect x="156" y="100" width="373" height="194" fill="#052e16"/>
  <text x="342" y="148" fill="#4ade80" font-size="32" font-weight="900" text-anchor="middle">✓  SAFE</text>
  <text x="342" y="175" fill="#bbf7d0" font-size="14" font-weight="600" text-anchor="middle">You made the right call.</text>
  <text x="342" y="197" fill="#86efac" font-size="12" text-anchor="middle">Prescient. Validated. Career enhanced.</text>
  <text x="342" y="217" fill="#4ade80" font-size="11" text-anchor="middle" opacity="0.75">Board credits you. Thesis proven.</text>
  <text x="342" y="280" fill="#166534" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="0.5">UPSIDE CAPTURED</text>

  <!-- Q2: Adopt + Doesn't Matter → OK -->
  <rect x="531" y="100" width="373" height="194" fill="#1c1207"/>
  <text x="717" y="148" fill="#fbbf24" font-size="32" font-weight="900" text-anchor="middle">~  DEFENSIBLE</text>
  <text x="717" y="175" fill="#fef3c7" font-size="14" font-weight="600" text-anchor="middle">You moved with the market.</text>
  <text x="717" y="197" fill="#fde68a" font-size="12" text-anchor="middle">Money wasted — but shared mistake.</text>
  <text x="717" y="217" fill="#fbbf24" font-size="11" text-anchor="middle" opacity="0.75">Not singled out. Career intact.</text>
  <text x="717" y="280" fill="#92400e" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="0.5">RECOVERABLE</text>

  <!-- Q3: Don't Adopt + Matters → CATASTROPHIC -->
  <rect x="156" y="296" width="373" height="233" fill="#3b0a0a"/>
  <rect x="156" y="296" width="373" height="233" fill="none" stroke="#dc2626" stroke-width="2"/>
  <text x="342" y="348" fill="#f87171" font-size="32" font-weight="900" text-anchor="middle">✗  CAREER RISK</text>
  <text x="342" y="376" fill="#fecaca" font-size="14" font-weight="600" text-anchor="middle">You said no to the platform shift.</text>
  <text x="342" y="397" fill="#fca5a5" font-size="12" text-anchor="middle">The person who missed it. Remembered.</text>
  <text x="342" y="418" fill="#f87171" font-size="11" text-anchor="middle" opacity="0.8">Board asks why. Competitors moved on.</text>
  <rect x="210" y="438" width="264" height="26" fill="#7f1d1d" rx="5"/>
  <text x="342" y="455" fill="#fecaca" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="0.8">THE ONLY UNRECOVERABLE OUTCOME</text>
  <text x="342" y="506" fill="#7f1d1d" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="0.5">ASYMMETRIC DOWNSIDE</text>

  <!-- Q4: Don't Adopt + Doesn't Matter → Correct but hollow -->
  <rect x="531" y="296" width="373" height="233" fill="#0a110a"/>
  <text x="717" y="348" fill="#86efac" font-size="32" font-weight="900" text-anchor="middle">✓  CORRECT</text>
  <text x="717" y="376" fill="#ecfccb" font-size="14" font-weight="600" text-anchor="middle">You saved company money.</text>
  <text x="717" y="397" fill="#d9f99d" font-size="12" text-anchor="middle">Right call. Rarely celebrated.</text>
  <text x="717" y="418" fill="#a3e635" font-size="11" text-anchor="middle" opacity="0.75">Requires courage. Needs vindication.</text>
  <text x="717" y="506" fill="#1a2e05" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="0.5">CORRECT BUT LONELY</text>

  <!-- Bottom note -->
  <text x="460" y="551" fill="#3f3f46" font-size="11" text-anchor="middle">Three of four outcomes favour adoption regardless of AI's actual value. The math is personal, not organisational.</text>
</svg>
