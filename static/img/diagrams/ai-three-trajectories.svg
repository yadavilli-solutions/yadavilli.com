<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 612" font-family="Inter, system-ui, sans-serif">
  <rect width="1200" height="612" fill="#09090b" rx="12"/>

  <!-- Title -->
  <text x="600" y="34" fill="#f4f4f5" font-size="17" font-weight="700" text-anchor="middle">Three Trajectories of AI Augmentation</text>
  <text x="600" y="54" fill="#52525b" font-size="12" text-anchor="middle">What actually happens to a role when AI is introduced, and why each trajectory requires a different measurement approach</text>

  <!-- Central hub: x=22 w=200 y=72 h=485 ends=557 -->
  <rect x="22" y="72" width="200" height="485" fill="#18181b" stroke="#3f3f46" stroke-width="1.5" rx="8"/>
  <text x="122" y="305" fill="#a1a1aa" font-size="13" font-weight="700" text-anchor="middle">AI</text>
  <text x="122" y="325" fill="#a1a1aa" font-size="13" font-weight="700" text-anchor="middle">AUGMENTS</text>
  <text x="122" y="345" fill="#a1a1aa" font-size="13" font-weight="700" text-anchor="middle">A ROLE</text>

  <!-- Arrow to Shrinkage -->
  <line x1="222" y1="178" x2="248" y2="148" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="244,141 257,148 247,156" fill="#16a34a"/>

  <!-- Arrow to Profile Change -->
  <line x1="222" y1="314" x2="248" y2="314" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="244,307 258,314 244,321" fill="#2563eb"/>

  <!-- Arrow to Replacement -->
  <line x1="222" y1="452" x2="248" y2="478" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="244,471 257,479 247,487" fill="#dc2626"/>

  <!-- SHRINKAGE BOX  y=72..227 (10px gap before Profile Change at 237) -->
  <rect x="252" y="72" width="924" height="155" fill="#052e16" stroke="#16a34a" stroke-width="1.5" rx="8"/>
  <rect x="252" y="72" width="924" height="38" fill="#14532d" rx="8"/>
  <rect x="252" y="98" width="924" height="12" fill="#14532d"/>
  <text x="714" y="97" fill="#86efac" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.5">SHRINKAGE</text>
  <text x="272" y="130" fill="#4ade80" font-size="13" font-weight="600">Same work. Fewer people.</text>
  <text x="272" y="150" fill="#bbf7d0" font-size="11">Output quality maintained. Headcount falls through attrition or RIF.</text>
  <text x="272" y="168" fill="#86efac" font-size="11">AI handles the routine. Humans supervise and handle exceptions.</text>
  <text x="272" y="188" fill="#4ade80" font-size="11" opacity="0.8">Examples: tier-1 support, contract triage, document extraction</text>
  <rect x="1068" y="82" width="100" height="22" fill="#166534" rx="4"/>
  <text x="1118" y="97" fill="#bbf7d0" font-size="10" font-weight="700" text-anchor="middle">18–36 MONTHS</text>

  <!-- PROFILE CHANGE BOX  y=237..392 (10px gap before Replacement at 402) -->
  <rect x="252" y="237" width="924" height="155" fill="#07101a" stroke="#2563eb" stroke-width="1.5" rx="8"/>
  <rect x="252" y="237" width="924" height="38" fill="#1e3a5f" rx="8"/>
  <rect x="252" y="263" width="924" height="12" fill="#1e3a5f"/>
  <text x="714" y="262" fill="#93c5fd" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.5">PROFILE CHANGE  ← dominant today</text>
  <text x="272" y="295" fill="#60a5fa" font-size="13" font-weight="600">Same headcount. Different work.</text>
  <text x="272" y="315" fill="#bfdbfe" font-size="11">Routine automated. Time shifts toward judgment, strategy, exceptions.</text>
  <text x="272" y="333" fill="#93c5fd" font-size="11">Role name unchanged. Job content transformed. No cost signal.</text>
  <text x="272" y="351" fill="#60a5fa" font-size="11" opacity="0.8">Examples: analyst → interpreter, lawyer → strategist, engineer → architect</text>
  <rect x="1068" y="247" width="100" height="22" fill="#1e3a5f" rx="4"/>
  <text x="1118" y="262" fill="#bfdbfe" font-size="10" font-weight="700" text-anchor="middle">12–24 MONTHS</text>

  <!-- REPLACEMENT BOX  y=402..557 -->
  <rect x="252" y="402" width="924" height="155" fill="#1c0505" stroke="#dc2626" stroke-width="1.5" rx="8"/>
  <rect x="252" y="402" width="924" height="38" fill="#450a0a" rx="8"/>
  <rect x="252" y="428" width="924" height="12" fill="#450a0a"/>
  <text x="714" y="427" fill="#fca5a5" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.5">REPLACEMENT</text>
  <text x="272" y="458" fill="#f87171" font-size="13" font-weight="600">Role eliminated. Humans no longer needed here.</text>
  <text x="272" y="478" fill="#fecaca" font-size="11">AI executes end-to-end. Human oversight minimal or absent.</text>
  <text x="272" y="496" fill="#fca5a5" font-size="11">Slowest to arrive. Most visible. Least common currently.</text>
  <text x="272" y="514" fill="#f87171" font-size="11" opacity="0.8">Early signals: junior coding roles, some paralegal, tier-1 anything</text>
  <rect x="1068" y="412" width="100" height="22" fill="#450a0a" rx="4"/>
  <text x="1118" y="427" fill="#fecaca" font-size="10" font-weight="700" text-anchor="middle">3–7 YEARS</text>

  <!-- Bottom notes -->
  <text x="600" y="577" fill="#3f3f46" font-size="11" text-anchor="middle">A fourth trajectory — Role Creation (new roles emerge: AI ops, governance, prompt engineering) — runs alongside all three.</text>
  <text x="600" y="595" fill="#3f3f46" font-size="11" text-anchor="middle">Most organisations are experiencing Profile Change while measuring for Shrinkage.</text>
</svg>
