<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" font-family="Inter, system-ui, sans-serif">
  <rect width="920" height="520" fill="#09090b" rx="12"/>

  <!-- Title -->
  <text x="460" y="34" fill="#f4f4f5" font-size="17" font-weight="700" text-anchor="middle">Three Trajectories of AI Augmentation</text>
  <text x="460" y="54" fill="#52525b" font-size="12" text-anchor="middle">What actually happens to a role when AI is introduced — and why each trajectory requires a different measurement approach</text>

  <!-- Central hub -->
  <rect x="22" y="130" width="168" height="258" fill="#18181b" stroke="#3f3f46" stroke-width="1.5" rx="8"/>
  <text x="106" y="230" fill="#a1a1aa" font-size="13" font-weight="700" text-anchor="middle">AI</text>
  <text x="106" y="250" fill="#a1a1aa" font-size="13" font-weight="700" text-anchor="middle">AUGMENTS</text>
  <text x="106" y="270" fill="#a1a1aa" font-size="13" font-weight="700" text-anchor="middle">A ROLE</text>

  <!-- Arrow to Shrinkage -->
  <line x1="190" y1="190" x2="380" y2="143" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="376,136 388,143 379,151" fill="#16a34a"/>

  <!-- Arrow to Profile Change -->
  <line x1="190" y1="258" x2="380" y2="258" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="376,251 390,258 376,265" fill="#2563eb"/>

  <!-- Arrow to Replacement -->
  <line x1="190" y1="326" x2="380" y2="373" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="376,366 388,374 379,381" fill="#dc2626"/>

  <!-- SHRINKAGE BOX -->
  <rect x="388" y="72" width="510" height="140" fill="#052e16" stroke="#16a34a" stroke-width="1.5" rx="8"/>
  <rect x="388" y="72" width="510" height="36" fill="#14532d" rx="8"/>
  <rect x="388" y="96" width="510" height="12" fill="#14532d"/>
  <text x="643" y="95" fill="#86efac" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.5">SHRINKAGE</text>
  <text x="406" y="130" fill="#4ade80" font-size="13" font-weight="600">Same work. Fewer people.</text>
  <text x="406" y="150" fill="#bbf7d0" font-size="11">Output quality maintained. Headcount falls through attrition or RIF.</text>
  <text x="406" y="168" fill="#86efac" font-size="11">AI handles the routine. Humans supervise and handle exceptions.</text>
  <text x="406" y="188" fill="#4ade80" font-size="11" opacity="0.8">Examples: tier-1 support, contract triage, document extraction</text>
  <rect x="796" y="82" width="92" height="22" fill="#166534" rx="4"/>
  <text x="842" y="97" fill="#bbf7d0" font-size="10" font-weight="700" text-anchor="middle">18–36 MONTHS</text>

  <!-- PROFILE CHANGE BOX -->
  <rect x="388" y="188" width="510" height="140" fill="#07101a" stroke="#2563eb" stroke-width="1.5" rx="8"/>
  <rect x="388" y="188" width="510" height="36" fill="#1e3a5f" rx="8"/>
  <rect x="388" y="212" width="510" height="12" fill="#1e3a5f"/>
  <text x="643" y="211" fill="#93c5fd" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.5">PROFILE CHANGE  ← dominant today</text>
  <text x="406" y="246" fill="#60a5fa" font-size="13" font-weight="600">Same headcount. Different work.</text>
  <text x="406" y="266" fill="#bfdbfe" font-size="11">Routine automated. Time shifts toward judgment, strategy, exceptions.</text>
  <text x="406" y="284" fill="#93c5fd" font-size="11">Role name unchanged. Job content transformed. No cost signal.</text>
  <text x="406" y="304" fill="#60a5fa" font-size="11" opacity="0.8">Examples: analyst → interpreter, lawyer → strategist, engineer → architect</text>
  <rect x="796" y="198" width="92" height="22" fill="#1e3a5f" rx="4"/>
  <text x="842" y="213" fill="#bfdbfe" font-size="10" font-weight="700" text-anchor="middle">12–24 MONTHS</text>

  <!-- REPLACEMENT BOX -->
  <rect x="388" y="304" width="510" height="140" fill="#1c0505" stroke="#dc2626" stroke-width="1.5" rx="8"/>
  <rect x="388" y="304" width="510" height="36" fill="#450a0a" rx="8"/>
  <rect x="388" y="328" width="510" height="12" fill="#450a0a"/>
  <text x="643" y="327" fill="#fca5a5" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.5">REPLACEMENT</text>
  <text x="406" y="362" fill="#f87171" font-size="13" font-weight="600">Role eliminated. Humans no longer needed here.</text>
  <text x="406" y="382" fill="#fecaca" font-size="11">AI executes end-to-end. Human oversight minimal or absent.</text>
  <text x="406" y="400" fill="#fca5a5" font-size="11">Slowest to arrive. Most visible. Least common currently.</text>
  <text x="406" y="420" fill="#f87171" font-size="11" opacity="0.8">Early signals: junior coding roles, some paralegal, tier-1 anything</text>
  <rect x="796" y="314" width="92" height="22" fill="#450a0a" rx="4"/>
  <text x="842" y="329" fill="#fecaca" font-size="10" font-weight="700" text-anchor="middle">3–7 YEARS</text>

  <!-- Note at bottom -->
  <text x="460" y="476" fill="#3f3f46" font-size="11" text-anchor="middle">A fourth trajectory — Role Creation (new roles emerge: AI ops, governance, prompt engineering) — runs alongside all three.</text>
  <text x="460" y="494" fill="#3f3f46" font-size="11" text-anchor="middle">Most organisations are experiencing Profile Change while measuring for Shrinkage.</text>
</svg>
