<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" font-family="Inter, system-ui, sans-serif">

  <!-- Background -->
  <rect width="900" height="580" fill="#09090b" rx="12"/>

  <!-- Chart area -->
  <!-- Ungoverned zone (red shaded triangle above diagonal) -->
  <polygon points="140,60 820,60 820,100" fill="#7f1d1d" opacity="0.25"/>
  <polygon points="140,60 820,60 820,460 140,460" fill="#7f1d1d" opacity="0.08"/>
  <!-- Governed zone below diagonal -->
  <polygon points="140,460 820,460 820,100 140,460" fill="#052e16" opacity="0.2"/>

  <!-- Diagonal boundary line (dashed) -->
  <line x1="140" y1="460" x2="820" y2="100" stroke="#3f3f46" stroke-width="1.5" stroke-dasharray="8,5"/>

  <!-- Axes -->
  <line x1="140" y1="60" x2="140" y2="470" stroke="#3f3f46" stroke-width="1.5"/>
  <line x1="130" y1="460" x2="830" y2="460" stroke="#3f3f46" stroke-width="1.5"/>

  <!-- Y-axis label -->
  <text transform="translate(28,300) rotate(-90)" fill="#a1a1aa" font-size="13" font-weight="500" text-anchor="middle" letter-spacing="0.3">Governed depth of agency</text>
  <text x="28" y="72" fill="#a1a1aa" font-size="16" text-anchor="middle">↑</text>

  <!-- X-axis label -->
  <text x="480" y="530" fill="#a1a1aa" font-size="13" font-weight="500" text-anchor="middle" letter-spacing="0.3">Breadth of agency →</text>

  <!-- Y-axis tick labels -->
  <text x="128" y="464" fill="#71717a" font-size="12" text-anchor="end">Assist</text>
  <text x="128" y="370" fill="#71717a" font-size="12" text-anchor="end">Delegate</text>
  <text x="128" y="265" fill="#71717a" font-size="12" text-anchor="end">Orchestrate</text>
  <text x="128" y="148" fill="#71717a" font-size="12" text-anchor="end">Autonomous</text>

  <!-- Y-axis tick marks -->
  <line x1="134" y1="460" x2="140" y2="460" stroke="#3f3f46" stroke-width="1"/>
  <line x1="134" y1="366" x2="140" y2="366" stroke="#3f3f46" stroke-width="1"/>
  <line x1="134" y1="260" x2="140" y2="260" stroke="#3f3f46" stroke-width="1"/>
  <line x1="134" y1="142" x2="140" y2="142" stroke="#3f3f46" stroke-width="1"/>

  <!-- X-axis tick labels -->
  <text x="225" y="488" fill="#71717a" font-size="12" text-anchor="middle">Single task</text>
  <text x="392" y="488" fill="#71717a" font-size="12" text-anchor="middle">Workflow</text>
  <text x="584" y="488" fill="#71717a" font-size="12" text-anchor="middle">Cross-domain</text>
  <text x="770" y="488" fill="#71717a" font-size="12" text-anchor="middle">Enterprise</text>

  <!-- X-axis tick marks -->
  <line x1="225" y1="460" x2="225" y2="466" stroke="#3f3f46" stroke-width="1"/>
  <line x1="392" y1="460" x2="392" y2="466" stroke="#3f3f46" stroke-width="1"/>
  <line x1="584" y1="460" x2="584" y2="466" stroke="#3f3f46" stroke-width="1"/>
  <line x1="770" y1="460" x2="770" y2="466" stroke="#3f3f46" stroke-width="1"/>

  <!-- "Beyond readiness = ungoverned" label -->
  <text x="530" y="130" fill="#fca5a5" font-size="14" font-weight="600" text-anchor="middle" opacity="0.9">Beyond readiness = ungoverned</text>

  <!-- Stage 1: AI-first (Single task / Assist) -->
  <rect x="155" y="390" width="148" height="52" rx="8" fill="#1e1b4b" stroke="#4338ca" stroke-width="1.5"/>
  <text x="229" y="412" fill="#a5b4fc" font-size="13" font-weight="700" text-anchor="middle">1  AI-first</text>
  <text x="229" y="430" fill="#6d6a9c" font-size="10" text-anchor="middle">Single task · Assist</text>

  <!-- Stage 2: Agentic (Workflow / Delegate) -->
  <rect x="310" y="298" width="148" height="52" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1.5"/>
  <text x="384" y="320" fill="#6ee7b7" font-size="13" font-weight="700" text-anchor="middle">2  Agentic</text>
  <text x="384" y="338" fill="#3d8c6e" font-size="10" text-anchor="middle">Workflow · Delegate</text>

  <!-- Stage 3: Code-first (Cross-domain / Orchestrate) -->
  <rect x="490" y="196" width="160" height="52" rx="8" fill="#0c2a4a" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="570" y="218" fill="#7dd3fc" font-size="13" font-weight="700" text-anchor="middle">3  Code-first</text>
  <text x="570" y="236" fill="#4a7a9b" font-size="10" text-anchor="middle">Cross-domain · Orchestrate</text>

  <!-- Stage 4: Adaptive (Enterprise / Autonomous) -->
  <rect x="672" y="96" width="140" height="52" rx="8" fill="#2d0a0a" stroke="#dc2626" stroke-width="1.5"/>
  <text x="742" y="118" fill="#fca5a5" font-size="13" font-weight="700" text-anchor="middle">4  Adaptive</text>
  <text x="742" y="136" fill="#8c4a4a" font-size="10" text-anchor="middle">Enterprise · Autonomous</text>

  <!-- Gate circles on diagonal -->
  <!-- Gate 1 circle: between Stage 1 and 2 -->
  <circle cx="295" cy="393" r="16" fill="#09090b" stroke="#78716c" stroke-width="1.5"/>
  <text x="295" y="398" fill="#d4c49a" font-size="12" font-weight="700" text-anchor="middle">1</text>

  <!-- Gate 2 circle: between Stage 2 and 3 -->
  <circle cx="488" cy="287" r="16" fill="#09090b" stroke="#78716c" stroke-width="1.5"/>
  <text x="488" y="292" fill="#d4c49a" font-size="12" font-weight="700" text-anchor="middle">2</text>

  <!-- Gate 3 circle: between Stage 3 and 4 -->
  <circle cx="672" cy="183" r="16" fill="#09090b" stroke="#78716c" stroke-width="1.5"/>
  <text x="672" y="188" fill="#d4c49a" font-size="12" font-weight="700" text-anchor="middle">3</text>

  <!-- Gate labels at bottom -->
  <line x1="140" y1="510" x2="820" y2="510" stroke="#1f1f24" stroke-width="1"/>
  <text x="480" y="555" fill="#52525b" font-size="11" text-anchor="middle">
    Gate 1: data readiness  ·  Gate 2: governance + guardrails  ·  Gate 3: observability + cost routing
  </text>

</svg>
