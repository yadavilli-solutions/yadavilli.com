<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="ar-em" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#34d399"/></marker>
    <marker id="ar-gy" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#71717a"/></marker>
  </defs>

  <rect width="900" height="600" fill="#09090b" rx="14"/>

  <!-- Title block -->
  <text x="40" y="46" fill="#6ee7b7" font-size="23" font-weight="700">Oracle</text>
  <rect x="138" y="29" width="74" height="22" rx="11" fill="#052e16" stroke="#10b981" stroke-width="1.1"/>
  <text x="175" y="44" fill="#6ee7b7" font-size="11" font-weight="600" text-anchor="middle">answer</text>
  <text x="40" y="70" fill="#a1a1aa" font-size="13">Synthesizes one authoritative answer in a narrow domain.</text>
  <!-- Invocation badge -->
  <rect x="788" y="30" width="72" height="24" rx="12" fill="none" stroke="#10b981" stroke-width="1.2"/>
  <text x="824" y="46" fill="#6ee7b7" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">PULL</text>
  <text x="784" y="20" fill="#52525b" font-size="9" text-anchor="end">SPECIALIST · deep skill, narrow scope</text>

  <!-- Domain knowledge cylinder (top) -->
  <g>
    <path d="M450 150 a90 16 0 0 0 180 0 v-40 a90 16 0 0 0 -180 0 z" fill="#1e293b" stroke="#64748b" stroke-width="1.3"/>
    <ellipse cx="540" cy="110" rx="90" ry="16" fill="#1e293b" stroke="#64748b" stroke-width="1.3"/>
    <text x="540" y="108" fill="#cbd5e1" font-size="12" font-weight="600" text-anchor="middle">Domain Knowledge</text>
    <text x="540" y="124" fill="#94a3b8" font-size="9.5" text-anchor="middle">curated · narrow · trusted</text>
  </g>

  <!-- User -->
  <rect x="70" y="270" width="130" height="72" rx="8" fill="#18181b" stroke="#71717a" stroke-width="1.4"/>
  <text x="135" y="302" fill="#d4d4d8" font-size="13" font-weight="600" text-anchor="middle">User</text>
  <text x="135" y="320" fill="#8a8a93" font-size="10" text-anchor="middle">asks a question</text>

  <!-- Oracle engine -->
  <rect x="378" y="250" width="170" height="108" rx="10" fill="#052e16" stroke="#10b981" stroke-width="2"/>
  <text x="463" y="290" fill="#6ee7b7" font-size="15" font-weight="700" text-anchor="middle">Oracle engine</text>
  <text x="463" y="312" fill="#3d8c6e" font-size="10.5" text-anchor="middle">ground · reason ·</text>
  <text x="463" y="327" fill="#3d8c6e" font-size="10.5" text-anchor="middle">commit to one answer</text>

  <!-- Answer -->
  <rect x="690" y="262" width="150" height="84" rx="8" fill="#06281a" stroke="#10b981" stroke-width="1.4"/>
  <text x="765" y="292" fill="#6ee7b7" font-size="12.5" font-weight="700" text-anchor="middle">Authoritative answer</text>
  <text x="765" y="312" fill="#3d8c6e" font-size="10" text-anchor="middle">+ citations</text>
  <text x="765" y="327" fill="#3d8c6e" font-size="10" text-anchor="middle">+ confidence</text>

  <!-- Flow arrows -->
  <!-- 1 user -> engine -->
  <line x1="200" y1="300" x2="372" y2="300" stroke="#34d399" stroke-width="1.7" marker-end="url(#ar-em)"/>
  <text x="286" y="290" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">1 · ask</text>
  <!-- 2 knowledge -> engine -->
  <line x1="528" y1="166" x2="480" y2="244" stroke="#71717a" stroke-width="1.5" marker-end="url(#ar-gy)"/>
  <text x="556" y="210" fill="#94a3b8" font-size="10.5" text-anchor="start">2 · ground</text>
  <!-- 3 engine -> answer -->
  <line x1="548" y1="304" x2="684" y2="304" stroke="#34d399" stroke-width="1.7" marker-end="url(#ar-em)"/>
  <text x="616" y="294" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">3 · synthesize</text>
  <!-- 4 answer -> user (return curve, routed low and clear) -->
  <path d="M765 348 C 560 472, 320 472, 135 346" fill="none" stroke="#34d399" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#ar-em)"/>
  <text x="445" y="466" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">4 · return one grounded answer</text>

  <!-- Signature callout -->
  <text x="463" y="392" fill="#52525b" font-size="10" text-anchor="middle" letter-spacing="0.5">STRUCTURAL SIGNATURE</text>
  <text x="463" y="409" fill="#a1a1aa" font-size="11" text-anchor="middle" font-weight="600">commits to a single authoritative answer — not a ranked list, not a draft</text>

  <!-- Divider -->
  <line x1="40" y1="500" x2="860" y2="500" stroke="#3f3f46" stroke-width="1" stroke-dasharray="8,5"/>

  <!-- Bottom band -->
  <text x="40" y="524" fill="#71717a" font-size="10" font-weight="700" letter-spacing="0.5">INVOCATION</text>
  <text x="40" y="542" fill="#a1a1aa" font-size="11">Pull — user initiates each question; stateless between calls.</text>
  <text x="40" y="566" fill="#71717a" font-size="10" font-weight="700" letter-spacing="0.5">FORCES</text>
  <text x="40" y="584" fill="#a1a1aa" font-size="11">Narrow domain depth buys authority; grounding + citations make the answer defensible.</text>

  <text x="860" y="524" fill="#71717a" font-size="10" font-weight="700" letter-spacing="0.5" text-anchor="end">DISTINGUISHED FROM</text>
  <text x="860" y="542" fill="#a1a1aa" font-size="11" text-anchor="end">Lookup — returns documents to read, not a synthesized answer.</text>
  <text x="860" y="566" fill="#71717a" font-size="10" font-weight="700" letter-spacing="0.5" text-anchor="end">&#160;</text>
  <text x="860" y="584" fill="#a1a1aa" font-size="11" text-anchor="end">Copilot — provisional suggestion in a loop, not an authority.</text>
</svg>
