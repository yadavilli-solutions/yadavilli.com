<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="ar-em" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#34d399"/></marker>
    <marker id="ar-gy" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#71717a"/></marker>
  </defs>

  <rect width="900" height="600" fill="#02023e" rx="14"/>

  <!-- Title block -->
  <text x="40" y="46" fill="#6ee7b7" font-size="23" font-weight="700">Artifact Generator</text>
  <rect x="278" y="29" width="82" height="22" rx="11" fill="#052e16" stroke="#10b981" stroke-width="1.1"/>
  <text x="319" y="44" fill="#6ee7b7" font-size="11" font-weight="600" text-anchor="middle">generate</text>
  <text x="40" y="70" fill="#a1a1aa" font-size="13">Assembles a complete, structured deliverable from a brief.</text>
  <!-- Invocation badge -->
  <rect x="788" y="30" width="72" height="24" rx="12" fill="none" stroke="#10b981" stroke-width="1.2"/>
  <text x="824" y="46" fill="#6ee7b7" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">PULL</text>
  <text x="784" y="20" fill="#6b7396" font-size="9" text-anchor="end">SPECIALIST · deep skill, narrow scope</text>

  <!-- Sources + Templates store (cylinder, top) -->
  <g>
    <path d="M298 168 a82 15 0 0 0 164 0 v-40 a82 15 0 0 0 -164 0 z" fill="#1e293b" stroke="#64748b" stroke-width="1.3"/>
    <ellipse cx="380" cy="128" rx="82" ry="15" fill="#1e293b" stroke="#64748b" stroke-width="1.3"/>
    <text x="380" y="126" fill="#cbd5e1" font-size="12" font-weight="600" text-anchor="middle">Sources + Templates</text>
    <text x="380" y="142" fill="#94a3b8" font-size="9.5" text-anchor="middle">facts · structure · style</text>
  </g>

  <!-- Brief / spec (input) -->
  <rect x="56" y="262" width="130" height="74" rx="8" fill="#0c0c52" stroke="#71717a" stroke-width="1.4"/>
  <text x="121" y="294" fill="#d4d4d8" font-size="13" font-weight="600" text-anchor="middle">Brief / spec</text>
  <text x="121" y="312" fill="#8a8a93" font-size="10" text-anchor="middle">what to produce</text>

  <!-- Generator engine -->
  <rect x="290" y="248" width="180" height="104" rx="10" fill="#052e16" stroke="#10b981" stroke-width="2"/>
  <text x="380" y="286" fill="#6ee7b7" font-size="15" font-weight="700" text-anchor="middle">Generator engine</text>
  <text x="380" y="308" fill="#3d8c6e" font-size="10.5" text-anchor="middle">plan · compose ·</text>
  <text x="380" y="323" fill="#3d8c6e" font-size="10.5" text-anchor="middle">assemble sections</text>

  <!-- Assembled Artifact (multi-section document) -->
  <rect x="592" y="238" width="158" height="124" rx="8" fill="#06281a" stroke="#10b981" stroke-width="1.4"/>
  <text x="671" y="262" fill="#6ee7b7" font-size="12.5" font-weight="700" text-anchor="middle">Assembled Artifact</text>
  <!-- inner section lines suggesting a multi-part whole -->
  <line x1="610" y1="276" x2="732" y2="276" stroke="#3d8c6e" stroke-width="1.1"/>
  <text x="618" y="293" fill="#3d8c6e" font-size="9.5" text-anchor="start">§ summary</text>
  <line x1="610" y1="302" x2="732" y2="302" stroke="#3d8c6e" stroke-width="1.1"/>
  <text x="618" y="319" fill="#3d8c6e" font-size="9.5" text-anchor="start">§ body</text>
  <line x1="610" y1="328" x2="732" y2="328" stroke="#3d8c6e" stroke-width="1.1"/>
  <text x="618" y="345" fill="#3d8c6e" font-size="9.5" text-anchor="start">§ appendix</text>

  <!-- Review gate (pill on the release path) -->
  <rect x="606" y="418" width="130" height="38" rx="19" fill="#0c0c52" stroke="#71717a" stroke-width="1.4"/>
  <text x="671" y="436" fill="#d4d4d8" font-size="11.5" font-weight="600" text-anchor="middle">Human review</text>
  <text x="671" y="450" fill="#8a8a93" font-size="9" text-anchor="middle">optional · before release</text>

  <!-- Flow arrows -->
  <!-- 1 brief -> engine -->
  <line x1="186" y1="299" x2="284" y2="299" stroke="#34d399" stroke-width="1.7" marker-end="url(#ar-em)"/>
  <text x="235" y="289" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">1 · submit</text>
  <!-- 2 store -> engine -->
  <line x1="380" y1="184" x2="380" y2="242" stroke="#71717a" stroke-width="1.5" marker-end="url(#ar-gy)"/>
  <text x="392" y="216" fill="#94a3b8" font-size="10.5" text-anchor="start">2 · pull</text>
  <!-- 3 engine -> artifact (assemble) -->
  <line x1="470" y1="298" x2="586" y2="298" stroke="#34d399" stroke-width="1.7" marker-end="url(#ar-em)"/>
  <text x="528" y="288" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">3 · assemble</text>
  <!-- 4 artifact -> review gate (emit) -->
  <line x1="671" y1="362" x2="671" y2="414" stroke="#34d399" stroke-width="1.7" marker-end="url(#ar-em)"/>
  <text x="681" y="392" fill="#34d399" font-size="11" font-weight="700" text-anchor="start">4 · emit</text>
  <!-- 5 review gate -> ship (out, dashed) -->
  <line x1="671" y1="456" x2="671" y2="488" stroke="#34d399" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#ar-em)"/>
  <text x="685" y="478" fill="#34d399" font-size="11" font-weight="700" text-anchor="start">5 · ship</text>

  <!-- Signature callout -->
  <text x="290" y="406" fill="#6b7396" font-size="10" text-anchor="middle" letter-spacing="0.5">STRUCTURAL SIGNATURE</text>
  <text x="290" y="423" fill="#a1a1aa" font-size="11" text-anchor="middle" font-weight="600">emits a finished, composite deliverable —</text>
  <text x="290" y="438" fill="#a1a1aa" font-size="11" text-anchor="middle" font-weight="600">many parts assembled into one whole, not a fragment</text>

  <!-- Divider -->
  <line x1="40" y1="500" x2="860" y2="500" stroke="#3f3f46" stroke-width="1" stroke-dasharray="8,5"/>

  <!-- Bottom band -->
  <text x="40" y="524" fill="#71717a" font-size="10" font-weight="700" letter-spacing="0.5">INVOCATION</text>
  <text x="40" y="542" fill="#a1a1aa" font-size="11">Pull — one brief in, one finished deliverable out.</text>
  <text x="40" y="566" fill="#71717a" font-size="10" font-weight="700" letter-spacing="0.5">FORCES</text>
  <text x="40" y="584" fill="#a1a1aa" font-size="11">Completeness and structure vs hallucinated content; the review burden on a long artifact.</text>

  <text x="860" y="524" fill="#71717a" font-size="10" font-weight="700" letter-spacing="0.5" text-anchor="end">DISTINGUISHED FROM</text>
  <text x="860" y="542" fill="#a1a1aa" font-size="11" text-anchor="end">Copilot — suggests fragments in the edit loop, not a whole document.</text>
  <text x="860" y="566" fill="#71717a" font-size="10" font-weight="700" letter-spacing="0.5" text-anchor="end">&#160;</text>
  <text x="860" y="584" fill="#a1a1aa" font-size="11" text-anchor="end">Transformer — maps one input to one output, not many composed.</text>
</svg>
