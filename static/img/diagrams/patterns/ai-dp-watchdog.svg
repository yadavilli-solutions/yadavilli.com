<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="ar-em" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#34d399"/></marker>
    <marker id="ar-gy" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#71717a"/></marker>
    <marker id="ar-push" markerWidth="10" markerHeight="9" refX="8.5" refY="4.5" orient="auto"><polygon points="0 0, 10 4.5, 0 9" fill="#34d399"/></marker>
    <marker id="ar-drop" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#52525b"/></marker>
  </defs>

  <rect width="900" height="600" fill="#09090b" rx="14"/>

  <!-- Title block -->
  <text x="40" y="46" fill="#6ee7b7" font-size="23" font-weight="700">Watchdog</text>
  <rect x="158" y="29" width="78" height="22" rx="11" fill="#052e16" stroke="#10b981" stroke-width="1.1"/>
  <text x="197" y="44" fill="#6ee7b7" font-size="11" font-weight="600" text-anchor="middle">monitor</text>
  <text x="40" y="70" fill="#a1a1aa" font-size="13">Watches a stream unattended and fires when a condition is met.</text>
  <!-- Tier tag + invocation badge -->
  <text x="784" y="20" fill="#52525b" font-size="9" text-anchor="end">SPECIALIST · deep skill, narrow scope</text>
  <rect x="772" y="30" width="88" height="24" rx="12" fill="none" stroke="#10b981" stroke-width="1.2"/>
  <text x="816" y="46" fill="#6ee7b7" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">POLL + PUSH</text>

  <!-- Rules / Model cylinder (top) -->
  <g>
    <path d="M388 156 a82 15 0 0 0 164 0 v-38 a82 15 0 0 0 -164 0 z" fill="#1e293b" stroke="#64748b" stroke-width="1.3"/>
    <ellipse cx="470" cy="118" rx="82" ry="15" fill="#1e293b" stroke="#64748b" stroke-width="1.3"/>
    <text x="470" y="116" fill="#cbd5e1" font-size="12" font-weight="600" text-anchor="middle">Rules / Model</text>
    <text x="470" y="131" fill="#94a3b8" font-size="9.5" text-anchor="middle">what counts as notable</text>
  </g>

  <!-- Event Stream (left) -->
  <rect x="44" y="244" width="140" height="92" rx="8" fill="#18181b" stroke="#71717a" stroke-width="1.4"/>
  <text x="114" y="272" fill="#d4d4d8" font-size="13" font-weight="600" text-anchor="middle">Event Stream</text>
  <text x="114" y="289" fill="#8a8a93" font-size="9.5" text-anchor="middle">events arrive</text>
  <text x="114" y="302" fill="#8a8a93" font-size="9.5" text-anchor="middle">continuously</text>
  <!-- little event ticks -->
  <line x1="64" y1="318" x2="76" y2="318" stroke="#52525b" stroke-width="2"/>
  <line x1="84" y1="318" x2="96" y2="318" stroke="#52525b" stroke-width="2"/>
  <line x1="104" y1="318" x2="116" y2="318" stroke="#52525b" stroke-width="2"/>
  <line x1="124" y1="318" x2="136" y2="318" stroke="#52525b" stroke-width="2"/>
  <line x1="144" y1="318" x2="156" y2="318" stroke="#52525b" stroke-width="2"/>

  <!-- Watchdog detector (engine) -->
  <rect x="360" y="240" width="180" height="108" rx="10" fill="#052e16" stroke="#10b981" stroke-width="2"/>
  <text x="450" y="280" fill="#6ee7b7" font-size="15" font-weight="700" text-anchor="middle">Watchdog detector</text>
  <text x="450" y="302" fill="#3d8c6e" font-size="10.5" text-anchor="middle">evaluate each event</text>
  <text x="450" y="317" fill="#3d8c6e" font-size="10.5" text-anchor="middle">against the rules</text>

  <!-- Human / downstream (right) -->
  <rect x="700" y="248" width="150" height="84" rx="8" fill="#18181b" stroke="#71717a" stroke-width="1.4"/>
  <text x="775" y="280" fill="#d4d4d8" font-size="13" font-weight="600" text-anchor="middle">Human</text>
  <text x="775" y="299" fill="#8a8a93" font-size="10" text-anchor="middle">receives a pushed</text>
  <text x="775" y="312" fill="#8a8a93" font-size="10" text-anchor="middle">alert · interrupted</text>

  <!-- Dropped events sink (below engine) -->
  <rect x="372" y="408" width="156" height="44" rx="8" fill="#101012" stroke="#3f3f46" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="450" y="427" fill="#52525b" font-size="11" font-weight="600" text-anchor="middle">dropped silently</text>
  <text x="450" y="442" fill="#52525b" font-size="9.5" text-anchor="middle">most events pass through</text>

  <!-- ===== Flow arrows ===== -->
  <!-- 1 · events arrive (ambient/continuous, dotted) -->
  <line x1="184" y1="290" x2="354" y2="290" stroke="#71717a" stroke-width="1.6" stroke-dasharray="2,4" marker-end="url(#ar-gy)"/>
  <text x="269" y="280" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">1 · events (poll / ambient)</text>

  <!-- 2 · rules -> engine (grounding, neutral) -->
  <line x1="464" y1="170" x2="456" y2="234" stroke="#71717a" stroke-width="1.5" marker-end="url(#ar-gy)"/>
  <text x="556" y="200" fill="#94a3b8" font-size="10.5" text-anchor="middle">2 · evaluate vs model</text>

  <!-- 3 · ordinary events dropped (silent, down) -->
  <line x1="450" y1="348" x2="450" y2="404" stroke="#52525b" stroke-width="1.4" stroke-dasharray="4,4" marker-end="url(#ar-drop)"/>
  <text x="610" y="382" fill="#52525b" font-size="11" font-weight="700" text-anchor="middle">3 · no match · drop (silent)</text>

  <!-- 4 · PUSH alert to human (bold, AI-initiated) -->
  <line x1="540" y1="285" x2="694" y2="285" stroke="#34d399" stroke-width="2.4" marker-end="url(#ar-push)"/>
  <text x="617" y="275" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">4 · PUSH alert</text>
  <text x="617" y="312" fill="#3d8c6e" font-size="9.5" text-anchor="middle">on match · AI initiates</text>

  <!-- Signature callout -->
  <text x="450" y="476" fill="#52525b" font-size="10" text-anchor="middle" letter-spacing="0.5">STRUCTURAL SIGNATURE</text>
  <text x="450" y="493" fill="#a1a1aa" font-size="11" text-anchor="middle" font-weight="600">runs unattended and pushes output on its own only when a watched condition fires — not asked each time</text>

  <!-- Divider -->
  <line x1="40" y1="500" x2="860" y2="500" stroke="#3f3f46" stroke-width="1" stroke-dasharray="8,5"/>

  <!-- Bottom band -->
  <text x="40" y="524" fill="#71717a" font-size="10" font-weight="700" letter-spacing="0.5">INVOCATION</text>
  <text x="40" y="542" fill="#a1a1aa" font-size="11">Poll + Push — watches the stream itself; initiates the alert when a condition fires.</text>
  <text x="40" y="566" fill="#71717a" font-size="10" font-weight="700" letter-spacing="0.5">FORCES</text>
  <text x="40" y="584" fill="#a1a1aa" font-size="11">False-positive cost vs missed-event cost; alert fatigue; threshold tuning.</text>

  <text x="860" y="524" fill="#71717a" font-size="10" font-weight="700" letter-spacing="0.5" text-anchor="end">DISTINGUISHED FROM</text>
  <text x="860" y="542" fill="#a1a1aa" font-size="11" text-anchor="end">Oracle / Lookup — pull: you ask. Watchdog watches and interrupts you.</text>
  <text x="860" y="566" fill="#71717a" font-size="10" font-weight="700" letter-spacing="0.5" text-anchor="end">&#160;</text>
  <text x="860" y="584" fill="#a1a1aa" font-size="11" text-anchor="end">Autopilot — acts on the world; Watchdog only raises a flag.</text>
</svg>
