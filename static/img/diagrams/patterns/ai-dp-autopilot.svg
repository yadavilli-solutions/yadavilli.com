<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="ar-am" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#fbbf24"/></marker>
    <marker id="ar-gy" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#71717a"/></marker>
    <marker id="ar-rd" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#f87171"/></marker>
  </defs>

  <rect width="900" height="600" fill="#02023e" rx="14"/>

  <!-- Title block -->
  <text x="40" y="46" fill="#fcd34d" font-size="23" font-weight="700">Autopilot</text>
  <rect x="158" y="29" width="74" height="22" rx="11" fill="#1c1917" stroke="#f59e0b" stroke-width="1.1"/>
  <text x="195" y="44" fill="#fcd34d" font-size="11" font-weight="600" text-anchor="middle">execute</text>
  <text x="40" y="70" fill="#a1a1aa" font-size="13">Takes multi-step action against real systems, under guardrails.</text>
  <!-- Tier tag -->
  <text x="784" y="20" fill="#6b7396" font-size="9" text-anchor="end">AGENT · output is action, not information</text>
  <!-- Invocation badge -->
  <rect x="688" y="30" width="172" height="24" rx="12" fill="none" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="774" y="46" fill="#fcd34d" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.3">PULL, THEN AUTONOMOUS LOOP</text>

  <!-- ===== Goal (input) ===== -->
  <rect x="44" y="250" width="120" height="70" rx="8" fill="#0c0c52" stroke="#71717a" stroke-width="1.4"/>
  <text x="104" y="282" fill="#d4d4d8" font-size="13" font-weight="600" text-anchor="middle">Goal</text>
  <text x="104" y="300" fill="#8a8a93" font-size="10" text-anchor="middle">a target state</text>

  <!-- ===== Planner / agent core ===== -->
  <rect x="236" y="238" width="168" height="96" rx="10" fill="#1c1917" stroke="#f59e0b" stroke-width="2"/>
  <text x="320" y="272" fill="#fcd34d" font-size="15" font-weight="700" text-anchor="middle">Planner</text>
  <text x="320" y="291" fill="#92702e" font-size="10.5" text-anchor="middle">plan · choose next</text>
  <text x="320" y="305" fill="#92702e" font-size="10.5" text-anchor="middle">action · replan</text>
  <text x="320" y="322" fill="#92702e" font-size="9.5" text-anchor="middle" font-style="italic">the agent core</text>

  <!-- ===== Guardrail + approval gate (ON the action path) ===== -->
  <g>
    <polygon points="490,286 524,266 558,286 524,306" fill="#2a1414" stroke="#f87171" stroke-width="1.6"/>
    <text x="524" y="283" fill="#fca5a5" font-size="10" font-weight="700" text-anchor="middle">GATE</text>
    <text x="524" y="296" fill="#fca5a5" font-size="9" text-anchor="middle">approve</text>
  </g>
  <text x="524" y="328" fill="#f87171" font-size="9.5" text-anchor="middle">guardrail</text>

  <!-- ===== Tools / Actuators ===== -->
  <rect x="610" y="248" width="120" height="76" rx="8" fill="#1c1917" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="670" y="280" fill="#fcd34d" font-size="13" font-weight="700" text-anchor="middle">Tools /</text>
  <text x="670" y="297" fill="#fcd34d" font-size="13" font-weight="700" text-anchor="middle">Actuators</text>
  <text x="670" y="314" fill="#92702e" font-size="9" text-anchor="middle">wired to real systems</text>

  <!-- ===== Environment / real world boundary (red, irreversible) ===== -->
  <rect x="600" y="92" width="262" height="132" rx="12" fill="none" stroke="#f87171" stroke-width="1.3" stroke-dasharray="7,5"/>
  <rect x="616" y="84" width="206" height="18" rx="4" fill="#02023e"/>
  <text x="719" y="97" fill="#f87171" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.5">REAL WORLD · EFFECTS IRREVERSIBLE</text>

  <!-- three real external systems -->
  <rect x="616" y="116" width="70" height="44" rx="5" fill="#2a1414" stroke="#f87171" stroke-width="1.3"/>
  <text x="651" y="138" fill="#fca5a5" font-size="9.5" font-weight="600" text-anchor="middle">Payments</text>
  <text x="651" y="151" fill="#b45454" font-size="8.5" text-anchor="middle">API</text>

  <rect x="709" y="116" width="70" height="44" rx="5" fill="#2a1414" stroke="#f87171" stroke-width="1.3"/>
  <text x="744" y="138" fill="#fca5a5" font-size="9.5" font-weight="600" text-anchor="middle">Inventory</text>
  <text x="744" y="151" fill="#b45454" font-size="8.5" text-anchor="middle">DB</text>

  <rect x="662" y="170" width="70" height="44" rx="5" fill="#2a1414" stroke="#f87171" stroke-width="1.3"/>
  <text x="697" y="192" fill="#fca5a5" font-size="9.5" font-weight="600" text-anchor="middle">Email /</text>
  <text x="697" y="205" fill="#fca5a5" font-size="9.5" font-weight="600" text-anchor="middle">Comms</text>

  <!-- ===== Flow arrows ===== -->
  <!-- 1 goal -> planner -->
  <line x1="164" y1="285" x2="230" y2="285" stroke="#fbbf24" stroke-width="1.7" marker-end="url(#ar-am)"/>
  <text x="197" y="276" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">1 · set</text>

  <!-- 2 plan (internal cue on planner) -->
  <text x="320" y="225" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">2 · plan</text>

  <!-- 3 planner -> gate -->
  <line x1="404" y1="286" x2="486" y2="286" stroke="#fbbf24" stroke-width="1.7" marker-end="url(#ar-am)"/>
  <text x="445" y="276" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">3 · act</text>
  <!-- gate -> tools -->
  <line x1="558" y1="286" x2="606" y2="286" stroke="#fbbf24" stroke-width="1.7" marker-end="url(#ar-am)"/>

  <!-- tools -> real world (irreversible, red, heavier) -->
  <line x1="670" y1="248" x2="670" y2="218" stroke="#f87171" stroke-width="2.2" marker-end="url(#ar-rd)"/>
  <text x="760" y="238" fill="#f87171" font-size="10" font-weight="700" text-anchor="middle">real, irreversible</text>

  <!-- 4 observe: real world -> planner (feedback loop, curved back to plan node) -->
  <path d="M610 195 C 500 175, 460 175, 380 175 C 300 175, 280 200, 280 232" fill="none" stroke="#fbbf24" stroke-width="1.7" stroke-dasharray="6,4" marker-end="url(#ar-am)"/>
  <text x="430" y="163" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">4 · observe results · replan until goal met</text>

  <!-- Loop emphasis label -->
  <text x="246" y="208" fill="#92702e" font-size="9" text-anchor="middle">feedback</text>

  <!-- Signature callout -->
  <text x="450" y="392" fill="#6b7396" font-size="10" text-anchor="middle" letter-spacing="0.5">STRUCTURAL SIGNATURE</text>
  <text x="450" y="409" fill="#a1a1aa" font-size="11" text-anchor="middle" font-weight="600">a closed plan-act-observe loop that changes the real world — guardrails are structural, not optional</text>

  <!-- Divider -->
  <line x1="40" y1="500" x2="860" y2="500" stroke="#3f3f46" stroke-width="1" stroke-dasharray="8,5"/>

  <!-- Bottom band -->
  <text x="40" y="524" fill="#71717a" font-size="10" font-weight="700" letter-spacing="0.5">INVOCATION</text>
  <text x="40" y="542" fill="#a1a1aa" font-size="11">Pull to set the goal, then an autonomous act-observe loop until done.</text>
  <text x="40" y="566" fill="#71717a" font-size="10" font-weight="700" letter-spacing="0.5">FORCES</text>
  <text x="40" y="584" fill="#a1a1aa" font-size="11">Autonomy vs control; blast radius drives gates, observability, reversibility.</text>

  <text x="860" y="524" fill="#71717a" font-size="10" font-weight="700" letter-spacing="0.5" text-anchor="end">DISTINGUISHED FROM</text>
  <text x="860" y="542" fill="#a1a1aa" font-size="11" text-anchor="end">Sandbox — same loop on a modelled world, no real effects.</text>
  <text x="860" y="566" fill="#71717a" font-size="10" font-weight="700" letter-spacing="0.5" text-anchor="end">&#160;</text>
  <text x="860" y="584" fill="#a1a1aa" font-size="11" text-anchor="end">Artifact Gen. — produces information; Autopilot produces change.</text>
</svg>
