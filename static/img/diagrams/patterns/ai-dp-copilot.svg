<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="ar-in" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#818cf8"/></marker>
    <marker id="ar-gy" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#71717a"/></marker>
  </defs>

  <rect width="900" height="600" fill="#09090b" rx="14"/>

  <!-- Title block -->
  <text x="40" y="46" fill="#a5b4fc" font-size="23" font-weight="700">Copilot</text>
  <rect x="146" y="29" width="80" height="22" rx="11" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.1"/>
  <text x="186" y="44" fill="#a5b4fc" font-size="11" font-weight="600" text-anchor="middle">generate</text>
  <text x="40" y="70" fill="#a1a1aa" font-size="13">Drafts in-context while the human stays in the loop.</text>
  <!-- Invocation badge -->
  <rect x="746" y="30" width="114" height="24" rx="12" fill="none" stroke="#6366f1" stroke-width="1.2"/>
  <text x="803" y="46" fill="#a5b4fc" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">AMBIENT + PULL</text>
  <text x="784" y="20" fill="#52525b" font-size="9" text-anchor="end">FEATURE · deep skill, narrow scope</text>

  <!-- ===== Work Surface (shared, upper-left of the loop) ===== -->
  <rect x="92" y="110" width="300" height="128" rx="8" fill="#211e52" stroke="#6366f1" stroke-width="1.4"/>
  <text x="242" y="134" fill="#a5b4fc" font-size="13" font-weight="700" text-anchor="middle">Work Surface  (shared)</text>
  <text x="242" y="150" fill="#6d6a9c" font-size="9.5" text-anchor="middle">the document / code being edited</text>
  <!-- existing content lines -->
  <line x1="116" y1="170" x2="340" y2="170" stroke="#4b4880" stroke-width="2"/>
  <line x1="116" y1="184" x2="300" y2="184" stroke="#4b4880" stroke-width="2"/>
  <!-- cursor -->
  <rect x="116" y="196" width="2.5" height="14" fill="#a5b4fc"/>
  <!-- provisional inline suggestion (ghost text) -->
  <rect x="124" y="196" width="190" height="16" rx="3" fill="#312e7a" stroke="#6366f1" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="132" y="208" fill="#8b88c4" font-size="9.5" font-style="italic">provisional suggestion (ghost)</text>
  <text x="242" y="228" fill="#6d6a9c" font-size="8.5" text-anchor="middle">inline · not yet committed</text>

  <!-- ===== User (lower-left of the loop) ===== -->
  <rect x="92" y="300" width="160" height="92" rx="8" fill="#18181b" stroke="#71717a" stroke-width="1.4"/>
  <text x="172" y="332" fill="#d4d4d8" font-size="14" font-weight="600" text-anchor="middle">User</text>
  <text x="172" y="351" fill="#8a8a93" font-size="10" text-anchor="middle">the committer</text>
  <text x="172" y="367" fill="#8a8a93" font-size="10" text-anchor="middle">accept / edit / reject</text>

  <!-- ===== Context (surrounding content + cursor) ===== -->
  <rect x="470" y="118" width="158" height="92" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.3"/>
  <text x="549" y="150" fill="#cbd5e1" font-size="12" font-weight="600" text-anchor="middle">Context</text>
  <text x="549" y="170" fill="#94a3b8" font-size="9.5" text-anchor="middle">surrounding content</text>
  <text x="549" y="185" fill="#94a3b8" font-size="9.5" text-anchor="middle">+ cursor</text>

  <!-- ===== Copilot engine ===== -->
  <rect x="690" y="284" width="162" height="104" rx="10" fill="#1e1b4b" stroke="#6366f1" stroke-width="2"/>
  <text x="771" y="320" fill="#a5b4fc" font-size="15" font-weight="700" text-anchor="middle">Copilot engine</text>
  <text x="771" y="342" fill="#6d6a9c" font-size="10.5" text-anchor="middle">drafts from context</text>
  <text x="771" y="358" fill="#6d6a9c" font-size="10.5" text-anchor="middle">never commits</text>

  <!-- ============ FLOW ============ -->

  <!-- 1 · user works on the surface (the tight loop, going up) -->
  <line x1="150" y1="300" x2="150" y2="244" stroke="#818cf8" stroke-width="1.7" marker-end="url(#ar-in)"/>
  <text x="78" y="276" fill="#818cf8" font-size="11" font-weight="700" text-anchor="start">1 · work</text>

  <!-- surface emits Context ambiently (neutral) -->
  <line x1="392" y1="164" x2="464" y2="164" stroke="#71717a" stroke-width="1.5" marker-end="url(#ar-gy)"/>

  <!-- 2 · context streams to engine (ambient dotted) -->
  <line x1="556" y1="212" x2="700" y2="292" stroke="#818cf8" stroke-width="1.6" stroke-dasharray="2,4" marker-end="url(#ar-in)"/>
  <text x="636" y="232" fill="#818cf8" font-size="11" font-weight="700" text-anchor="start">2 · stream</text>
  <text x="636" y="246" fill="#818cf8" font-size="11" font-weight="700" text-anchor="start">(ambient)</text>

  <!-- 3 · engine returns provisional suggestion overlaid inline (dashed, pull/return) -->
  <path d="M690 320 C 470 410, 360 300, 318 218" fill="none" stroke="#818cf8" stroke-width="1.7" stroke-dasharray="6,4" marker-end="url(#ar-in)"/>
  <text x="486" y="372" fill="#818cf8" font-size="11" font-weight="700" text-anchor="middle">3 · suggest inline (provisional)</text>

  <!-- 4 · human accepts/edits/rejects -> commits the accepted change UP onto the shared surface; the human is the committer, the loop closes -->
  <line x1="205" y1="300" x2="205" y2="244" stroke="#818cf8" stroke-width="2.4" marker-end="url(#ar-in)"/>
  <text x="262" y="290" fill="#818cf8" font-size="11" font-weight="700" text-anchor="start">4 · commit</text>

  <!-- review gate pill ON the commit path -->
  <rect x="174" y="262" width="62" height="20" rx="10" fill="#09090b" stroke="#6366f1" stroke-width="1.2"/>
  <text x="205" y="276" fill="#a5b4fc" font-size="10" font-weight="600" text-anchor="middle">review</text>

  <!-- loop bracket annotation: the tight bidirectional loop -->
  <path d="M70 240 q-12 32 0 64" fill="none" stroke="#6d6a9c" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="42" y="276" fill="#6d6a9c" font-size="8.5" text-anchor="middle" transform="rotate(-90 42 276)">tight loop</text>

  <!-- Signature callout -->
  <text x="468" y="446" fill="#52525b" font-size="10" text-anchor="middle" letter-spacing="0.5">STRUCTURAL SIGNATURE</text>
  <text x="468" y="463" fill="#a1a1aa" font-size="11" text-anchor="middle" font-weight="600">a tight loop on a shared surface — every AI output is provisional, the human commits</text>

  <!-- Divider -->
  <line x1="40" y1="500" x2="860" y2="500" stroke="#3f3f46" stroke-width="1" stroke-dasharray="8,5"/>

  <!-- Bottom band -->
  <text x="40" y="524" fill="#71717a" font-size="10" font-weight="700" letter-spacing="0.5">INVOCATION</text>
  <text x="40" y="542" fill="#a1a1aa" font-size="11">Ambient + pull — context streams as you work; you summon and accept.</text>
  <text x="40" y="566" fill="#71717a" font-size="10" font-weight="700" letter-spacing="0.5">FORCES</text>
  <text x="40" y="584" fill="#a1a1aa" font-size="11">Latency and accept/reject UX dominate; trust is bought with reversibility.</text>

  <text x="860" y="524" fill="#71717a" font-size="10" font-weight="700" letter-spacing="0.5" text-anchor="end">DISTINGUISHED FROM</text>
  <text x="860" y="542" fill="#a1a1aa" font-size="11" text-anchor="end">Oracle — commits to an authoritative answer; Copilot only suggests.</text>
  <text x="860" y="566" fill="#71717a" font-size="10" font-weight="700" letter-spacing="0.5" text-anchor="end">&#160;</text>
  <text x="860" y="584" fill="#a1a1aa" font-size="11" text-anchor="end">Artifact Generator — emits a finished deliverable; Copilot, fragments.</text>
</svg>
