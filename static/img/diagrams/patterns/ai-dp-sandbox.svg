<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="ar-am" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#fbbf24"/></marker>
    <marker id="ar-gy" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#71717a"/></marker>
  </defs>

  <rect width="900" height="600" fill="#02023e" rx="14"/>

  <!-- Title block -->
  <text x="40" y="46" fill="#fcd34d" font-size="23" font-weight="700">Sandbox</text>
  <rect x="148" y="29" width="80" height="22" rx="11" fill="#1c1917" stroke="#f59e0b" stroke-width="1.1"/>
  <text x="188" y="44" fill="#fcd34d" font-size="11" font-weight="600" text-anchor="middle">simulate</text>
  <text x="40" y="70" fill="#a1a1aa" font-size="13">Models a world to test decisions safely — projects, never acts.</text>
  <!-- Invocation badge -->
  <rect x="788" y="30" width="72" height="24" rx="12" fill="none" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="824" y="46" fill="#fcd34d" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">PULL</text>
  <text x="784" y="20" fill="#6b7396" font-size="9" text-anchor="end">AGENT · broad scope, projected effects</text>

  <!-- ===== Real World: disconnected, greyed, behind a dashed boundary ===== -->
  <rect x="676" y="118" width="184" height="246" rx="12" fill="none" stroke="#64748b" stroke-width="1.3" stroke-dasharray="7,5"/>
  <rect x="700" y="126" width="86" height="17" rx="4" fill="#02023e"/>
  <text x="743" y="139" fill="#71717a" font-size="9.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">NO EFFECTS CROSS</text>
  <rect x="708" y="190" width="120" height="96" rx="8" fill="#0c0c52" stroke="#3f3f46" stroke-width="1.4"/>
  <text x="768" y="226" fill="#6b7396" font-size="13" font-weight="700" text-anchor="middle">Real World</text>
  <text x="768" y="246" fill="#3f3f46" font-size="10" text-anchor="middle">untouched</text>
  <text x="768" y="261" fill="#3f3f46" font-size="10" text-anchor="middle">receives nothing</text>
  <!-- greyed disconnected stub -->
  <line x1="676" y1="240" x2="648" y2="240" stroke="#3f3f46" stroke-width="1.4" stroke-dasharray="3,4"/>
  <circle cx="648" cy="240" r="3" fill="none" stroke="#6b7396" stroke-width="1.3"/>
  <line x1="643" y1="235" x2="653" y2="245" stroke="#6b7396" stroke-width="1.3"/>

  <!-- ===== Scenario / what-if input ===== -->
  <rect x="44" y="252" width="128" height="72" rx="8" fill="#0c0c52" stroke="#71717a" stroke-width="1.4"/>
  <text x="108" y="282" fill="#d4d4d8" font-size="13" font-weight="600" text-anchor="middle">Scenario</text>
  <text x="108" y="300" fill="#8a8a93" font-size="10" text-anchor="middle">a what-if input</text>
  <text x="108" y="314" fill="#8a8a93" font-size="10" text-anchor="middle">from the user</text>

  <!-- ===== Simulation engine (pattern core) ===== -->
  <rect x="240" y="232" width="170" height="112" rx="10" fill="#1c1917" stroke="#f59e0b" stroke-width="2"/>
  <text x="325" y="272" fill="#fcd34d" font-size="15" font-weight="700" text-anchor="middle">Simulation engine</text>
  <text x="325" y="296" fill="#92702e" font-size="10.5" text-anchor="middle">run the scenario ·</text>
  <text x="325" y="311" fill="#92702e" font-size="10.5" text-anchor="middle">project forward ·</text>
  <text x="325" y="326" fill="#92702e" font-size="10.5" text-anchor="middle">branch outcomes</text>

  <!-- ===== World Model (the simulated world) — cylinder ===== -->
  <g>
    <path d="M235 198 a90 16 0 0 0 180 0 v-44 a90 16 0 0 0 -180 0 z" fill="#1e293b" stroke="#64748b" stroke-width="1.3"/>
    <ellipse cx="325" cy="154" rx="90" ry="16" fill="#1e293b" stroke="#64748b" stroke-width="1.3"/>
    <text x="325" y="152" fill="#cbd5e1" font-size="12" font-weight="600" text-anchor="middle">World Model</text>
    <text x="325" y="168" fill="#94a3b8" font-size="9.5" text-anchor="middle">simulated world · a mirror</text>
  </g>

  <!-- ===== Projected Outcomes (branches) ===== -->
  <rect x="470" y="206" width="150" height="36" rx="7" fill="#231a10" stroke="#f59e0b" stroke-width="1.4"/>
  <text x="545" y="223" fill="#fcd34d" font-size="11.5" font-weight="600" text-anchor="middle">Outcome A</text>
  <text x="545" y="236" fill="#92702e" font-size="9" text-anchor="middle">projected · not real</text>
  <rect x="470" y="252" width="150" height="36" rx="7" fill="#231a10" stroke="#f59e0b" stroke-width="1.4"/>
  <text x="545" y="269" fill="#fcd34d" font-size="11.5" font-weight="600" text-anchor="middle">Outcome B</text>
  <text x="545" y="282" fill="#92702e" font-size="9" text-anchor="middle">projected · not real</text>
  <rect x="470" y="298" width="150" height="36" rx="7" fill="#231a10" stroke="#f59e0b" stroke-width="1.4"/>
  <text x="545" y="315" fill="#fcd34d" font-size="11.5" font-weight="600" text-anchor="middle">Outcome C</text>
  <text x="545" y="328" fill="#92702e" font-size="9" text-anchor="middle">projected · not real</text>

  <!-- ===== Flow arrows ===== -->
  <!-- 1 scenario -> engine -->
  <line x1="172" y1="288" x2="234" y2="288" stroke="#fbbf24" stroke-width="1.7" marker-end="url(#ar-am)"/>
  <text x="203" y="278" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">1</text>
  <text x="203" y="312" fill="#92702e" font-size="9.5" text-anchor="middle">define</text>
  <!-- 2 world model -> engine (run against it) -->
  <line x1="325" y1="214" x2="325" y2="226" stroke="#71717a" stroke-width="1.5" marker-end="url(#ar-gy)"/>
  <text x="422" y="194" fill="#94a3b8" font-size="10.5" text-anchor="start">2 · run against model</text>
  <!-- 3 engine -> outcome branches -->
  <line x1="410" y1="270" x2="464" y2="224" stroke="#fbbf24" stroke-width="1.7" marker-end="url(#ar-am)"/>
  <line x1="410" y1="288" x2="464" y2="270" stroke="#fbbf24" stroke-width="1.7" marker-end="url(#ar-am)"/>
  <line x1="410" y1="306" x2="464" y2="316" stroke="#fbbf24" stroke-width="1.7" marker-end="url(#ar-am)"/>
  <text x="432" y="345" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">3 · branch</text>

  <!-- 4 outcomes -> user compares & decides (return curve, sweeps low below the signature) -->
  <path d="M560 336 C 610 500, 70 500, 108 324" fill="none" stroke="#fbbf24" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#ar-am)"/>
  <text x="326" y="485" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">4 · user compares outcomes and decides</text>

  <!-- Signature callout -->
  <text x="326" y="378" fill="#6b7396" font-size="10" text-anchor="middle" letter-spacing="0.5">STRUCTURAL SIGNATURE</text>
  <text x="326" y="395" fill="#a1a1aa" font-size="11" text-anchor="middle" font-weight="600">a world-model boundary isolates simulated effects from reality</text>

  <!-- Divider -->
  <line x1="40" y1="500" x2="860" y2="500" stroke="#3f3f46" stroke-width="1" stroke-dasharray="8,5"/>

  <!-- Bottom band -->
  <text x="40" y="524" fill="#71717a" font-size="10" font-weight="700" letter-spacing="0.5">INVOCATION</text>
  <text x="40" y="542" fill="#a1a1aa" font-size="11">Pull — user poses a what-if; the engine projects, the world stays untouched.</text>
  <text x="40" y="566" fill="#71717a" font-size="10" font-weight="700" letter-spacing="0.5">FORCES</text>
  <text x="40" y="584" fill="#a1a1aa" font-size="11">Model fidelity vs cost; a decision is only as good as the model behind it.</text>

  <text x="860" y="524" fill="#71717a" font-size="10" font-weight="700" letter-spacing="0.5" text-anchor="end">DISTINGUISHED FROM</text>
  <text x="860" y="542" fill="#a1a1aa" font-size="11" text-anchor="end">Autopilot — acts on the real world; Sandbox acts on a model of it.</text>
  <text x="860" y="566" fill="#71717a" font-size="10" font-weight="700" letter-spacing="0.5" text-anchor="end">&#160;</text>
  <text x="860" y="584" fill="#a1a1aa" font-size="11" text-anchor="end">Oracle — answers a question; Sandbox explores a choice's consequences.</text>
</svg>
