<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="ct-arrow" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" fill="#6b7396"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" fill="#02023e" rx="12"/>

  <!-- Title -->
  <text x="450" y="34" fill="#e4e4e7" font-size="15" font-weight="600" text-anchor="middle" letter-spacing="0.3">The Closure Test: Four Buckets, One Growth Path</text>
  <text x="450" y="54" fill="#71717a" font-size="11" text-anchor="middle">"You missed a pattern" becomes a bounded, falsifiable burden — not an opinion fight.</text>

  <!-- Top box -->
  <rect x="320" y="74" width="260" height="42" rx="8" fill="#0c0c52" stroke="#3f3f46" stroke-width="1.4"/>
  <text x="450" y="93" fill="#e4e4e7" font-size="12.5" font-weight="600" text-anchor="middle">Someone proposes a new pattern P</text>
  <text x="450" y="108" fill="#71717a" font-size="10" text-anchor="middle">it must land in exactly one bucket</text>

  <!-- Fan-out arrows -->
  <line x1="450" y1="116" x2="130" y2="158" stroke="#6b7396" stroke-width="1.3" marker-end="url(#ct-arrow)"/>
  <line x1="450" y1="116" x2="343" y2="158" stroke="#6b7396" stroke-width="1.3" marker-end="url(#ct-arrow)"/>
  <line x1="450" y1="116" x2="557" y2="158" stroke="#6b7396" stroke-width="1.3" marker-end="url(#ct-arrow)"/>
  <line x1="450" y1="116" x2="769" y2="158" stroke="#3fe3ef" stroke-width="1.6" marker-end="url(#ct-arrow)"/>

  <!-- ===== Bucket (a) ===== -->
  <rect x="30" y="162" width="201" height="262" rx="9" fill="#0c0c52" stroke="#3f3f46" stroke-width="1.2"/>
  <text x="48" y="190" fill="#71717a" font-size="20" font-weight="800" text-anchor="start">a</text>
  <text x="130" y="186" fill="#a1a1aa" font-size="12.5" font-weight="700" text-anchor="middle">Reduces to a</text>
  <text x="130" y="201" fill="#a1a1aa" font-size="12.5" font-weight="700" text-anchor="middle">named cell</text>
  <line x1="48" y1="214" x2="213" y2="214" stroke="#27272a" stroke-width="1"/>
  <text x="130" y="234" fill="#71717a" font-size="10.5" text-anchor="middle">Same (verb, skill,</text>
  <text x="130" y="249" fill="#71717a" font-size="10.5" text-anchor="middle">breadth) already</text>
  <text x="130" y="264" fill="#71717a" font-size="10.5" text-anchor="middle">in the grid.</text>
  <text x="130" y="292" fill="#6b7396" font-size="10" text-anchor="middle" font-style="italic">NL-to-SQL = Oracle</text>
  <text x="130" y="307" fill="#6b7396" font-size="10" text-anchor="middle" font-style="italic">Chatbot = Persona</text>
  <rect x="48" y="378" width="165" height="30" rx="6" fill="#27272a"/>
  <text x="130" y="397" fill="#a1a1aa" font-size="10.5" font-weight="600" text-anchor="middle">alias — not new</text>

  <!-- ===== Bucket (b) ===== -->
  <rect x="243" y="162" width="201" height="262" rx="9" fill="#0c0c52" stroke="#3f3f46" stroke-width="1.2"/>
  <text x="261" y="190" fill="#71717a" font-size="20" font-weight="800" text-anchor="start">b</text>
  <text x="343" y="186" fill="#a1a1aa" font-size="12.5" font-weight="700" text-anchor="middle">Composite</text>
  <text x="343" y="201" fill="#a1a1aa" font-size="12.5" font-weight="700" text-anchor="middle">of cells</text>
  <line x1="261" y1="214" x2="426" y2="214" stroke="#27272a" stroke-width="1"/>
  <text x="343" y="234" fill="#71717a" font-size="10.5" text-anchor="middle">Chains named</text>
  <text x="343" y="249" fill="#71717a" font-size="10.5" text-anchor="middle">cells. User buys a</text>
  <text x="343" y="264" fill="#71717a" font-size="10.5" text-anchor="middle">workflow.</text>
  <text x="343" y="292" fill="#6b7396" font-size="9.5" text-anchor="middle" font-style="italic">Deep Research =</text>
  <text x="343" y="306" fill="#6b7396" font-size="9.5" text-anchor="middle" font-style="italic">Autopilot+Lookup+Oracle</text>
  <rect x="261" y="378" width="165" height="30" rx="6" fill="#27272a"/>
  <text x="343" y="397" fill="#a1a1aa" font-size="10.5" font-weight="600" text-anchor="middle">not a primitive</text>

  <!-- ===== Bucket (c) ===== -->
  <rect x="456" y="162" width="201" height="262" rx="9" fill="#0c0c52" stroke="#3f3f46" stroke-width="1.2"/>
  <text x="474" y="190" fill="#71717a" font-size="20" font-weight="800" text-anchor="start">c</text>
  <text x="556" y="186" fill="#a1a1aa" font-size="12.5" font-weight="700" text-anchor="middle">Mechanism</text>
  <text x="556" y="201" fill="#71717a" font-size="9.5" text-anchor="middle">(largest bucket)</text>
  <line x1="474" y1="214" x2="639" y2="214" stroke="#27272a" stroke-width="1"/>
  <text x="556" y="234" fill="#71717a" font-size="10.5" text-anchor="middle">Lives inside a cell.</text>
  <text x="556" y="249" fill="#71717a" font-size="10.5" text-anchor="middle">Invisible at the</text>
  <text x="556" y="264" fill="#71717a" font-size="10.5" text-anchor="middle">product surface.</text>
  <text x="556" y="290" fill="#6b7396" font-size="9.5" text-anchor="middle" font-style="italic">ReAct · RAG · memory</text>
  <text x="556" y="304" fill="#6b7396" font-size="9.5" text-anchor="middle" font-style="italic">autonomy levels</text>
  <text x="556" y="318" fill="#6b7396" font-size="9.5" text-anchor="middle" font-style="italic">invocation protocol</text>
  <rect x="474" y="378" width="165" height="30" rx="6" fill="#27272a"/>
  <text x="556" y="397" fill="#a1a1aa" font-size="10.5" font-weight="600" text-anchor="middle">wrong layer</text>

  <!-- ===== Bucket (d) — the growth path ===== -->
  <rect x="669" y="162" width="201" height="262" rx="9" fill="#0c2a33" stroke="#3fe3ef" stroke-width="1.8"/>
  <text x="687" y="190" fill="#3fe3ef" font-size="20" font-weight="800" text-anchor="start">d</text>
  <text x="769" y="186" fill="#67e8f9" font-size="12.5" font-weight="700" text-anchor="middle">New primitive</text>
  <text x="769" y="201" fill="#67e8f9" font-size="12.5" font-weight="700" text-anchor="middle">verb</text>
  <line x1="687" y1="214" x2="852" y2="214" stroke="#155e75" stroke-width="1"/>
  <text x="769" y="234" fill="#7dd3e8" font-size="10.5" text-anchor="middle">An I/O operation</text>
  <text x="769" y="249" fill="#7dd3e8" font-size="10.5" text-anchor="middle">not reducible to</text>
  <text x="769" y="264" fill="#7dd3e8" font-size="10.5" text-anchor="middle">the eight verbs.</text>
  <text x="769" y="292" fill="#3fe3ef" font-size="10" text-anchor="middle" font-style="italic">simulate → Sandbox</text>
  <text x="769" y="308" fill="#155e75" font-size="9.5" text-anchor="middle">burden on challenger</text>
  <rect x="687" y="378" width="165" height="30" rx="6" fill="#155e75"/>
  <text x="769" y="397" fill="#cffafe" font-size="10.5" font-weight="700" text-anchor="middle">+ GROWS THE SET</text>

  <!-- Bottom banner -->
  <text x="450" y="456" fill="#a1a1aa" font-size="11.5" font-weight="600" text-anchor="middle">Only bucket (d) expands the taxonomy — and verbs are finite, arguable from I/O type theory.</text>
  <text x="450" y="478" fill="#71717a" font-size="10.5" text-anchor="middle">Red team: 19 attacks → 18 absorbed into (a)/(b)/(c) → 1 forced bucket (d): the new verb simulate.</text>
  <text x="450" y="500" fill="#6b7396" font-size="10" text-anchor="middle">Closed everywhere except where a genuinely new verb provably appears.</text>
</svg>
