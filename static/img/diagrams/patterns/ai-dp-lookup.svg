<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="ar-em" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#818cf8"/></marker>
    <marker id="ar-gy" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#71717a"/></marker>
  </defs>

  <rect width="900" height="600" fill="#09090b" rx="14"/>

  <!-- Title block -->
  <text x="40" y="46" fill="#a5b4fc" font-size="23" font-weight="700">Lookup</text>
  <rect x="135" y="29" width="76" height="22" rx="11" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.1"/>
  <text x="173" y="44" fill="#a5b4fc" font-size="11" font-weight="600" text-anchor="middle">retrieve</text>
  <text x="40" y="70" fill="#a1a1aa" font-size="13">Finds and ranks existing items from a corpus — never generates.</text>
  <!-- Invocation badge -->
  <rect x="788" y="30" width="72" height="24" rx="12" fill="none" stroke="#6366f1" stroke-width="1.2"/>
  <text x="824" y="46" fill="#a5b4fc" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">PULL</text>
  <text x="784" y="20" fill="#52525b" font-size="9" text-anchor="end">FEATURE · deep skill, narrow scope</text>

  <!-- Corpus cylinder (top, large) -->
  <g>
    <path d="M438 158 a96 18 0 0 0 192 0 v-52 a96 18 0 0 0 -192 0 z" fill="#1e293b" stroke="#64748b" stroke-width="1.3"/>
    <ellipse cx="534" cy="106" rx="96" ry="18" fill="#1e293b" stroke="#64748b" stroke-width="1.3"/>
    <text x="534" y="104" fill="#cbd5e1" font-size="12.5" font-weight="600" text-anchor="middle">Corpus</text>
    <text x="534" y="120" fill="#94a3b8" font-size="9.5" text-anchor="middle">large store of existing documents</text>
    <!-- inner shelf lines to suggest many docs -->
    <path d="M438 134 a96 18 0 0 0 192 0" fill="none" stroke="#64748b" stroke-width="0.7" opacity="0.4"/>
    <path d="M438 147 a96 18 0 0 0 192 0" fill="none" stroke="#64748b" stroke-width="0.7" opacity="0.32"/>
  </g>

  <!-- User -->
  <rect x="60" y="270" width="130" height="72" rx="8" fill="#18181b" stroke="#71717a" stroke-width="1.4"/>
  <text x="125" y="302" fill="#d4d4d8" font-size="13" font-weight="600" text-anchor="middle">User</text>
  <text x="125" y="320" fill="#8a8a93" font-size="10" text-anchor="middle">submits a query</text>

  <!-- Index / Retriever engine (the pattern core) -->
  <rect x="368" y="250" width="178" height="108" rx="10" fill="#1e1b4b" stroke="#6366f1" stroke-width="2"/>
  <text x="457" y="288" fill="#a5b4fc" font-size="15" font-weight="700" text-anchor="middle">Index / Retriever</text>
  <text x="457" y="310" fill="#6d6a9c" font-size="10.5" text-anchor="middle">embed · match ·</text>
  <text x="457" y="325" fill="#6d6a9c" font-size="10.5" text-anchor="middle">score top-k</text>

  <!-- Ranked Results (ordered list, not prose) -->
  <rect x="688" y="248" width="154" height="112" rx="8" fill="#211e52" stroke="#6366f1" stroke-width="1.4"/>
  <text x="765" y="272" fill="#a5b4fc" font-size="12.5" font-weight="700" text-anchor="middle">Ranked Results</text>
  <!-- ordered list rows -->
  <text x="704" y="296" fill="#6d6a9c" font-size="10.5" font-weight="700">1.</text>
  <line x1="718" y1="293" x2="826" y2="293" stroke="#6d6a9c" stroke-width="3" opacity="0.85"/>
  <text x="704" y="316" fill="#6d6a9c" font-size="10.5" font-weight="700">2.</text>
  <line x1="718" y1="313" x2="818" y2="313" stroke="#6d6a9c" stroke-width="3" opacity="0.6"/>
  <text x="704" y="336" fill="#6d6a9c" font-size="10.5" font-weight="700">3.</text>
  <line x1="718" y1="333" x2="808" y2="333" stroke="#6d6a9c" stroke-width="3" opacity="0.4"/>
  <text x="765" y="352" fill="#6d6a9c" font-size="9" text-anchor="middle">ordered list of sources</text>

  <!-- Flow arrows -->
  <!-- 1 user -> retriever -->
  <line x1="190" y1="300" x2="362" y2="300" stroke="#818cf8" stroke-width="1.7" marker-end="url(#ar-em)"/>
  <text x="276" y="290" fill="#818cf8" font-size="11" font-weight="700" text-anchor="middle">1 · query</text>
  <!-- 2 retriever -> corpus (match against index) : neutral data line, pull from corpus -->
  <line x1="487" y1="244" x2="520" y2="166" stroke="#71717a" stroke-width="1.5" marker-end="url(#ar-gy)"/>
  <text x="430" y="206" fill="#94a3b8" font-size="10.5" text-anchor="end">2 · match index</text>
  <!-- 3 corpus -> retriever (pull top-k) -->
  <line x1="556" y1="168" x2="524" y2="244" stroke="#71717a" stroke-width="1.5" marker-end="url(#ar-gy)"/>
  <text x="586" y="206" fill="#94a3b8" font-size="10.5" text-anchor="start">3 · pull top-k</text>
  <!-- retriever -> ranked results (surface) -->
  <line x1="546" y1="304" x2="682" y2="304" stroke="#818cf8" stroke-width="1.7" marker-end="url(#ar-em)"/>
  <text x="614" y="294" fill="#818cf8" font-size="11" font-weight="700" text-anchor="middle">rank</text>
  <!-- 4 results -> user (return curve) -->
  <path d="M765 362 C 560 470, 320 470, 125 346" fill="none" stroke="#818cf8" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#ar-em)"/>
  <text x="445" y="464" fill="#818cf8" font-size="11" font-weight="700" text-anchor="middle">4 · surface ranked results — nothing new is written</text>

  <!-- Signature callout -->
  <text x="457" y="392" fill="#52525b" font-size="10" text-anchor="middle" letter-spacing="0.5">STRUCTURAL SIGNATURE</text>
  <text x="457" y="409" fill="#a1a1aa" font-size="11" text-anchor="middle" font-weight="600">returns things that already exist, ranked — no synthesis, no new content</text>

  <!-- Divider -->
  <line x1="40" y1="500" x2="860" y2="500" stroke="#3f3f46" stroke-width="1" stroke-dasharray="8,5"/>

  <!-- Bottom band -->
  <text x="40" y="524" fill="#71717a" font-size="10" font-weight="700" letter-spacing="0.5">INVOCATION</text>
  <text x="40" y="542" fill="#a1a1aa" font-size="11">Pull — user issues a query; the retriever surfaces, never generates.</text>
  <text x="40" y="566" fill="#71717a" font-size="10" font-weight="700" letter-spacing="0.5">FORCES</text>
  <text x="40" y="584" fill="#a1a1aa" font-size="11">Recall vs precision; index freshness; ranking quality.</text>

  <text x="860" y="524" fill="#71717a" font-size="10" font-weight="700" letter-spacing="0.5" text-anchor="end">DISTINGUISHED FROM</text>
  <text x="860" y="542" fill="#a1a1aa" font-size="11" text-anchor="end">Oracle — synthesizes one answer; Lookup returns ranked sources.</text>
  <text x="860" y="566" fill="#71717a" font-size="10" font-weight="700" letter-spacing="0.5" text-anchor="end">&#160;</text>
  <text x="860" y="584" fill="#a1a1aa" font-size="11" text-anchor="end">Copilot — writes new text; Lookup only finds.</text>
</svg>
