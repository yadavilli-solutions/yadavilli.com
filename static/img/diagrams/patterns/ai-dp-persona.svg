<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="ar-am" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#fbbf24"/></marker>
    <marker id="ar-gy" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#71717a"/></marker>
    <marker id="ar-amb" markerWidth="8.5" markerHeight="7.5" refX="7" refY="3.75" orient="auto"><polygon points="0 0, 8.5 3.75, 0 7.5" fill="#fbbf24"/></marker>
  </defs>

  <rect width="900" height="600" fill="#02023e" rx="14"/>

  <!-- Title block -->
  <text x="40" y="46" fill="#fcd34d" font-size="23" font-weight="700">Persona</text>
  <rect x="148" y="29" width="80" height="22" rx="11" fill="#1c1917" stroke="#f59e0b" stroke-width="1.1"/>
  <text x="188" y="44" fill="#fcd34d" font-size="11" font-weight="600" text-anchor="middle">converse</text>
  <text x="40" y="70" fill="#a1a1aa" font-size="13">A stateful relationship that persists across sessions.</text>
  <!-- Tier tag -->
  <text x="784" y="20" fill="#6b7396" font-size="9" text-anchor="end">AGENT · sustained, stateful relationship</text>
  <!-- Invocation badge -->
  <rect x="784" y="30" width="76" height="24" rx="12" fill="none" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="822" y="46" fill="#fcd34d" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">PULL + PUSH</text>

  <!-- ===== Persistent Memory cylinder (left, spans the timeline) ===== -->
  <g>
    <path d="M58 415 a72 15 0 0 0 144 0 v-130 a72 15 0 0 0 -144 0 z" fill="#1e293b" stroke="#64748b" stroke-width="1.3"/>
    <ellipse cx="130" cy="285" rx="72" ry="15" fill="#1e293b" stroke="#64748b" stroke-width="1.3"/>
    <text x="130" y="283" fill="#cbd5e1" font-size="12.5" font-weight="600" text-anchor="middle">Memory / State</text>
    <text x="130" y="299" fill="#94a3b8" font-size="9.5" text-anchor="middle">persists · read + write</text>
    <text x="130" y="362" fill="#94a3b8" font-size="9.5" text-anchor="middle">facts · history</text>
    <text x="130" y="376" fill="#94a3b8" font-size="9.5" text-anchor="middle">preferences</text>
  </g>
  <!-- persistence note under cylinder -->
  <text x="130" y="445" fill="#92702e" font-size="9.5" text-anchor="middle">4 · persists across sessions</text>

  <!-- ===== Timeline baseline across sessions ===== -->
  <line x1="222" y1="470" x2="858" y2="470" stroke="#3f3f46" stroke-width="1.2"/>
  <polygon points="858,470 848,466 848,474" fill="#3f3f46"/>
  <text x="852" y="487" fill="#6b7396" font-size="9.5" text-anchor="end">time</text>

  <!-- Session ticks -->
  <line x1="300" y1="465" x2="300" y2="475" stroke="#6b7396" stroke-width="1.2"/>
  <line x1="540" y1="465" x2="540" y2="475" stroke="#6b7396" stroke-width="1.2"/>
  <line x1="770" y1="465" x2="770" y2="475" stroke="#6b7396" stroke-width="1.2"/>
  <text x="300" y="487" fill="#71717a" font-size="9.5" text-anchor="middle">Session 1</text>
  <text x="540" y="487" fill="#71717a" font-size="9.5" text-anchor="middle">Session 2</text>
  <text x="770" y="487" fill="#71717a" font-size="9.5" text-anchor="middle">Session N</text>

  <!-- Session enclosures (dashed) -->
  <rect x="232" y="130" width="158" height="322" rx="9" fill="none" stroke="#3f3f46" stroke-width="1.1" stroke-dasharray="6,5"/>
  <rect x="462" y="130" width="158" height="322" rx="9" fill="none" stroke="#3f3f46" stroke-width="1.1" stroke-dasharray="6,5"/>
  <rect x="692" y="130" width="158" height="322" rx="9" fill="none" stroke="#3f3f46" stroke-width="1.1" stroke-dasharray="6,5"/>

  <!-- ============ SESSION 1 ============ -->
  <!-- User -->
  <rect x="252" y="142" width="118" height="56" rx="8" fill="#0c0c52" stroke="#71717a" stroke-width="1.4"/>
  <text x="311" y="168" fill="#d4d4d8" font-size="12.5" font-weight="600" text-anchor="middle">User</text>
  <text x="311" y="185" fill="#8a8a93" font-size="9.5" text-anchor="middle">turn</text>
  <!-- Persona agent -->
  <rect x="248" y="280" width="126" height="92" rx="10" fill="#1c1917" stroke="#f59e0b" stroke-width="2"/>
  <text x="311" y="312" fill="#fcd34d" font-size="13.5" font-weight="700" text-anchor="middle">Persona</text>
  <text x="311" y="330" fill="#92702e" font-size="9.5" text-anchor="middle">converse ·</text>
  <text x="311" y="343" fill="#92702e" font-size="9.5" text-anchor="middle">recall + update</text>
  <!-- converse loop S1 -->
  <line x1="311" y1="198" x2="311" y2="274" stroke="#fbbf24" stroke-width="1.7" marker-end="url(#ar-am)"/>
  <path d="M323 274 C 348 248, 348 224, 323 200" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#ar-am)"/>
  <text x="356" y="240" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="start">1 ·</text>
  <text x="356" y="254" fill="#92702e" font-size="9.5" text-anchor="start">converse</text>

  <!-- ============ SESSION 2 ============ -->
  <rect x="482" y="142" width="118" height="56" rx="8" fill="#0c0c52" stroke="#71717a" stroke-width="1.4"/>
  <text x="541" y="168" fill="#d4d4d8" font-size="12.5" font-weight="600" text-anchor="middle">User</text>
  <text x="541" y="185" fill="#8a8a93" font-size="9.5" text-anchor="middle">turn</text>
  <rect x="478" y="280" width="126" height="92" rx="10" fill="#1c1917" stroke="#f59e0b" stroke-width="2"/>
  <text x="541" y="312" fill="#fcd34d" font-size="13.5" font-weight="700" text-anchor="middle">Persona</text>
  <text x="541" y="330" fill="#92702e" font-size="9.5" text-anchor="middle">converse ·</text>
  <text x="541" y="343" fill="#92702e" font-size="9.5" text-anchor="middle">recall + update</text>
  <line x1="541" y1="198" x2="541" y2="274" stroke="#fbbf24" stroke-width="1.7" marker-end="url(#ar-am)"/>
  <path d="M553 274 C 578 248, 578 224, 553 200" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#ar-am)"/>

  <!-- ============ SESSION N ============ -->
  <rect x="712" y="142" width="118" height="56" rx="8" fill="#0c0c52" stroke="#71717a" stroke-width="1.4"/>
  <text x="771" y="168" fill="#d4d4d8" font-size="12.5" font-weight="600" text-anchor="middle">User</text>
  <text x="771" y="185" fill="#8a8a93" font-size="9.5" text-anchor="middle">turn</text>
  <rect x="708" y="280" width="126" height="92" rx="10" fill="#1c1917" stroke="#f59e0b" stroke-width="2"/>
  <text x="771" y="312" fill="#fcd34d" font-size="13.5" font-weight="700" text-anchor="middle">Persona</text>
  <text x="771" y="330" fill="#92702e" font-size="9.5" text-anchor="middle">converse ·</text>
  <text x="771" y="343" fill="#92702e" font-size="9.5" text-anchor="middle">recall + update</text>
  <line x1="771" y1="198" x2="771" y2="274" stroke="#fbbf24" stroke-width="1.7" marker-end="url(#ar-am)"/>
  <path d="M783 274 C 808 248, 808 224, 783 200" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#ar-am)"/>

  <!-- ===== Read / write memory (each turn) — neutral grounding to cylinder ===== -->
  <!-- S1 agent <-> memory -->
  <line x1="248" y1="320" x2="200" y2="340" stroke="#71717a" stroke-width="1.5" marker-end="url(#ar-gy)"/>
  <line x1="200" y1="356" x2="248" y2="338" stroke="#71717a" stroke-width="1.5" marker-end="url(#ar-gy)"/>
  <text x="224" y="316" fill="#94a3b8" font-size="10.5" font-weight="700" text-anchor="middle">2 ·</text>
  <text x="232" y="358" fill="#94a3b8" font-size="9.5" text-anchor="middle">read + write</text>
  <!-- S2 agent -> memory (routed below the boxes to avoid crossing any label) -->
  <path d="M520 372 V 392 H 214 L 198 382" fill="none" stroke="#71717a" stroke-width="1.4" marker-end="url(#ar-gy)" stroke-dasharray="2,3"/>
  <!-- SN agent -> memory (routed below the boxes to avoid crossing any label) -->
  <path d="M750 372 V 402 H 214 L 198 392" fill="none" stroke="#71717a" stroke-width="1.4" marker-end="url(#ar-gy)" stroke-dasharray="2,3"/>

  <!-- Personality / policy chip (governs every agent) -->
  <rect x="372" y="402" width="156" height="40" rx="8" fill="#231a10" stroke="#f59e0b" stroke-width="1.3"/>
  <text x="450" y="420" fill="#fcd34d" font-size="11.5" font-weight="700" text-anchor="middle">Personality / policy</text>
  <text x="450" y="434" fill="#92702e" font-size="9.5" text-anchor="middle">consistent identity over time</text>

  <!-- ===== PUSH proactive follow-up (heavy amber, AI-initiated, later) ===== -->
  <path d="M834 318 C 872 256, 872 222, 836 200" fill="none" stroke="#fbbf24" stroke-width="2.4" marker-end="url(#ar-amb)"/>
  <text x="852" y="250" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="end">3 ·</text>
  <text x="852" y="264" fill="#92702e" font-size="9.5" text-anchor="end">PUSH</text>
  <text x="852" y="276" fill="#92702e" font-size="9.5" text-anchor="end">follow-up</text>

  <!-- Signature callout -->
  <text x="500" y="92" fill="#6b7396" font-size="10" text-anchor="middle" letter-spacing="0.5">STRUCTURAL SIGNATURE</text>
  <text x="500" y="109" fill="#a1a1aa" font-size="11" text-anchor="middle" font-weight="600">persistent memory and identity carried across a timeline — continuity is the core, not an ephemeral call</text>

  <!-- Divider -->
  <line x1="40" y1="500" x2="860" y2="500" stroke="#3f3f46" stroke-width="1" stroke-dasharray="8,5"/>

  <!-- Bottom band -->
  <text x="40" y="524" fill="#71717a" font-size="10" font-weight="700" letter-spacing="0.5">INVOCATION</text>
  <text x="40" y="542" fill="#a1a1aa" font-size="11">Pull each turn; push proactive follow-ups later, drawing on memory.</text>
  <text x="40" y="566" fill="#71717a" font-size="10" font-weight="700" letter-spacing="0.5">FORCES</text>
  <text x="40" y="584" fill="#a1a1aa" font-size="11">Continuity + personalization vs privacy + state bloat; keep identity consistent over time.</text>

  <text x="860" y="524" fill="#71717a" font-size="10" font-weight="700" letter-spacing="0.5" text-anchor="end">DISTINGUISHED FROM</text>
  <text x="860" y="542" fill="#a1a1aa" font-size="11" text-anchor="end">Copilot — ephemeral loop, no cross-session memory.</text>
  <text x="860" y="566" fill="#71717a" font-size="10" font-weight="700" letter-spacing="0.5" text-anchor="end">&#160;</text>
  <text x="860" y="584" fill="#a1a1aa" font-size="11" text-anchor="end">Oracle — stateless Q&amp;A; Persona carries the relationship forward.</text>
</svg>
