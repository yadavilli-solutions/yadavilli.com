<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" font-family="Inter, system-ui, sans-serif">
  <rect width="920" height="400" fill="#09090b" rx="12"/>

  <!-- Title -->
  <text x="460" y="34" fill="#f4f4f5" font-size="17" font-weight="700" text-anchor="middle">The Budget Translation</text>
  <text x="460" y="54" fill="#52525b" font-size="12" text-anchor="middle">How actual investment motivations become the only language finance will approve</text>

  <!-- LEFT BOX: Real motivations -->
  <rect x="20" y="72" width="270" height="295" fill="#1a0a0a" stroke="#7f1d1d" stroke-width="1.5" rx="8"/>
  <rect x="20" y="72" width="270" height="38" fill="#7f1d1d" rx="8"/>
  <rect x="20" y="98" width="270" height="12" fill="#7f1d1d"/>
  <text x="155" y="96" fill="#fecaca" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.5">WHAT WAS ACTUALLY PURCHASED</text>

  <!-- Left items -->
  <text x="40" y="134" fill="#f87171" font-size="11" font-weight="700">BOARD PRESSURE</text>
  <text x="40" y="152" fill="#fca5a5" font-size="11">"What is your AI strategy?"</text>
  <text x="40" y="168" fill="#71717a" font-size="10">Narrative gap creates urgency</text>

  <line x1="40" y1="182" x2="270" y2="182" stroke="#3f3f46" stroke-width="0.5" stroke-dasharray="4,3"/>

  <text x="40" y="200" fill="#f87171" font-size="11" font-weight="700">CAREER INSURANCE</text>
  <text x="40" y="218" fill="#fca5a5" font-size="11">"I can't be the one who said no."</text>
  <text x="40" y="234" fill="#71717a" font-size="10">Asymmetric personal downside</text>

  <line x1="40" y1="248" x2="270" y2="248" stroke="#3f3f46" stroke-width="0.5" stroke-dasharray="4,3"/>

  <text x="40" y="266" fill="#f87171" font-size="11" font-weight="700">VENDOR BUNDLING</text>
  <text x="40" y="284" fill="#fca5a5" font-size="11">"Microsoft included it in the EA."</text>
  <text x="40" y="300" fill="#71717a" font-size="10">Decision made by procurement inertia</text>

  <line x1="40" y1="314" x2="270" y2="314" stroke="#3f3f46" stroke-width="0.5" stroke-dasharray="4,3"/>

  <text x="40" y="332" fill="#f87171" font-size="11" font-weight="700">FOMO / COMPETITIVE PARITY</text>
  <text x="40" y="350" fill="#fca5a5" font-size="11">"Our competitor just announced."</text>
  <text x="40" y="366" fill="#71717a" font-size="10">Mimicry dressed as strategy</text>

  <!-- CENTER: Filter/Process -->
  <rect x="320" y="120" width="280" height="200" fill="#18181b" stroke="#3f3f46" stroke-width="1" rx="8"/>
  <!-- Gear-like decoration at top -->
  <text x="460" y="162" fill="#52525b" font-size="32" text-anchor="middle">⚙</text>
  <text x="460" y="200" fill="#a1a1aa" font-size="13" font-weight="700" text-anchor="middle">BUDGET APPROVAL</text>
  <text x="460" y="220" fill="#a1a1aa" font-size="13" font-weight="700" text-anchor="middle">PROCESS</text>
  <text x="460" y="248" fill="#52525b" font-size="11" text-anchor="middle">DCF requirement</text>
  <text x="460" y="264" fill="#52525b" font-size="11" text-anchor="middle">Finance sign-off</text>
  <text x="460" y="280" fill="#52525b" font-size="11" text-anchor="middle">Board presentation</text>

  <!-- Arrows left → center -->
  <line x1="292" y1="185" x2="318" y2="185" stroke="#7f1d1d" stroke-width="2"/>
  <polygon points="318,180 330,185 318,190" fill="#7f1d1d"/>
  <line x1="292" y1="220" x2="318" y2="220" stroke="#7f1d1d" stroke-width="2"/>
  <polygon points="318,215 330,220 318,225" fill="#7f1d1d"/>
  <line x1="292" y1="255" x2="318" y2="255" stroke="#7f1d1d" stroke-width="2"/>
  <polygon points="318,250 330,255 318,260" fill="#7f1d1d"/>

  <!-- Arrows center → right -->
  <line x1="602" y1="185" x2="628" y2="185" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="628,180 640,185 628,190" fill="#1d4ed8"/>
  <line x1="602" y1="220" x2="628" y2="220" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="628,215 640,220 628,225" fill="#1d4ed8"/>
  <line x1="602" y1="255" x2="628" y2="255" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="628,250 640,255 628,260" fill="#1d4ed8"/>

  <!-- RIGHT BOX: Budget memo language -->
  <rect x="630" y="72" width="270" height="295" fill="#07101a" stroke="#1d4ed8" stroke-width="1.5" rx="8"/>
  <rect x="630" y="72" width="270" height="38" fill="#1e3a5f" rx="8"/>
  <rect x="630" y="98" width="270" height="12" fill="#1e3a5f"/>
  <text x="765" y="96" fill="#bfdbfe" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.5">WHAT THE BUDGET MEMO SAYS</text>

  <!-- Right items -->
  <text x="650" y="134" fill="#60a5fa" font-size="11" font-weight="700">PRODUCTIVITY GAINS</text>
  <text x="650" y="152" fill="#93c5fd" font-size="11">"Developer throughput +25%"</text>
  <text x="650" y="168" fill="#71717a" font-size="10">Vendor ROI calculator supplied</text>

  <line x1="650" y1="182" x2="880" y2="182" stroke="#3f3f46" stroke-width="0.5" stroke-dasharray="4,3"/>

  <text x="650" y="200" fill="#60a5fa" font-size="11" font-weight="700">COST SAVINGS</text>
  <text x="650" y="218" fill="#93c5fd" font-size="11">"$30M over 24 months"</text>
  <text x="650" y="234" fill="#71717a" font-size="10">Safely unverifiable until Q8</text>

  <line x1="650" y1="248" x2="880" y2="248" stroke="#3f3f46" stroke-width="0.5" stroke-dasharray="4,3"/>

  <text x="650" y="266" fill="#60a5fa" font-size="11" font-weight="700">COMPETITIVE RISK MITIGATION</text>
  <text x="650" y="284" fill="#93c5fd" font-size="11">"Maintain market parity"</text>
  <text x="650" y="300" fill="#71717a" font-size="10">Unfalsifiable by design</text>

  <line x1="650" y1="314" x2="880" y2="314" stroke="#3f3f46" stroke-width="0.5" stroke-dasharray="4,3"/>

  <text x="650" y="332" fill="#60a5fa" font-size="11" font-weight="700">TALENT RETENTION</text>
  <text x="650" y="350" fill="#93c5fd" font-size="11">"Engineers expect modern tools"</text>
  <text x="650" y="366" fill="#71717a" font-size="10">True, but not the trigger</text>

  <!-- Bottom note -->
  <text x="460" y="390" fill="#3f3f46" font-size="11" text-anchor="middle">The translation is not fraud. It is the normal behaviour of converting embarrassing motivations into legible budget categories.</text>
</svg>
