<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" font-family="Inter, system-ui, sans-serif">

  <!-- Background -->
  <rect width="900" height="580" fill="#02023e" rx="12"/>

  <!-- Title -->
  <text x="480" y="38" fill="#e4e4e7" font-size="15" font-weight="600" text-anchor="middle" letter-spacing="0.4">Adoption Readiness: AI Maturity × AI Ambition</text>

  <!-- Quadrant fills -->
  <!-- TL: Optimize (High Maturity, Low Ambition) -->
  <rect x="141" y="61" width="338" height="198" fill="#052e16" opacity="0.28"/>
  <!-- TR: Transform (High Maturity, High Ambition) -->
  <rect x="481" y="61" width="338" height="198" fill="#1c1917" opacity="0.4"/>
  <!-- BL: Explore (Low Maturity, Low Ambition) -->
  <rect x="141" y="261" width="338" height="198" fill="#1e1b4b" opacity="0.28"/>
  <!-- BR: Danger Zone (Low Maturity, High Ambition) -->
  <rect x="481" y="261" width="338" height="198" fill="#7f1d1d" opacity="0.22"/>

  <!-- Dividing lines -->
  <line x1="140" y1="260" x2="820" y2="260" stroke="#3f3f46" stroke-width="1.5" stroke-dasharray="8,5"/>
  <line x1="480" y1="60" x2="480" y2="460" stroke="#3f3f46" stroke-width="1.5" stroke-dasharray="8,5"/>

  <!-- Axes -->
  <line x1="140" y1="56" x2="140" y2="462" stroke="#6b7396" stroke-width="1.5"/>
  <line x1="138" y1="460" x2="822" y2="460" stroke="#6b7396" stroke-width="1.5"/>

  <!-- Axis arrowheads -->
  <polygon points="140,54 136,64 144,64" fill="#6b7396"/>
  <polygon points="824,460 814,456 814,464" fill="#6b7396"/>

  <!-- Axis labels -->
  <text transform="translate(24,260) rotate(-90)" fill="#a1a1aa" font-size="13" font-weight="500" text-anchor="middle">AI Maturity  (data · governance · team · trust)</text>
  <text x="480" y="532" fill="#a1a1aa" font-size="13" font-weight="500" text-anchor="middle">AI Ambition  (efficiency → differentiation → transformation)</text>

  <!-- Low/High labels -->
  <text x="128" y="464" fill="#6b7396" font-size="11" text-anchor="end">Low</text>
  <text x="128" y="72" fill="#6b7396" font-size="11" text-anchor="end">High</text>
  <text x="148" y="478" fill="#6b7396" font-size="11" text-anchor="start">Low</text>
  <text x="812" y="478" fill="#6b7396" font-size="11" text-anchor="end">High</text>

  <!-- Quadrant name labels -->
  <text x="310" y="88" fill="#6ee7b7" font-size="13" font-weight="700" text-anchor="middle" opacity="0.65" letter-spacing="2">OPTIMIZE</text>
  <text x="650" y="88" fill="#fbbf24" font-size="13" font-weight="700" text-anchor="middle" opacity="0.65" letter-spacing="2">TRANSFORM</text>
  <text x="310" y="288" fill="#818cf8" font-size="13" font-weight="700" text-anchor="middle" opacity="0.65" letter-spacing="2">EXPLORE</text>
  <text x="650" y="288" fill="#f87171" font-size="13" font-weight="700" text-anchor="middle" opacity="0.75" letter-spacing="2">DANGER ZONE</text>

  <!-- EXPLORE content (BL) -->
  <text x="310" y="330" fill="#6d6a9c" font-size="12" text-anchor="middle">Patterns: Copilot, Lookup</text>
  <text x="310" y="350" fill="#6d6a9c" font-size="11" text-anchor="middle">Build team skill · Establish data pipelines</text>
  <text x="310" y="368" fill="#6d6a9c" font-size="11" text-anchor="middle">Earn user trust · Don't skip this stage</text>
  <!-- Industry tags -->
  <rect x="222" y="400" width="52" height="22" rx="4" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/>
  <text x="248" y="415" fill="#a5b4fc" font-size="10" font-weight="600" text-anchor="middle">SaaS early</text>
  <rect x="284" y="400" width="68" height="22" rx="4" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/>
  <text x="318" y="415" fill="#a5b4fc" font-size="10" font-weight="600" text-anchor="middle">Enterprise new</text>

  <!-- OPTIMIZE content (TL) -->
  <text x="310" y="130" fill="#3d8c6e" font-size="11.5" text-anchor="middle">Patterns: Oracle, Watchdog, Transformer, Artifact Gen.</text>
  <text x="310" y="150" fill="#3d8c6e" font-size="11" text-anchor="middle">Targeted Specialist plays · Strong ROI</text>
  <text x="310" y="168" fill="#3d8c6e" font-size="11" text-anchor="middle">Low risk · High-value narrow wins</text>
  <!-- Industry tags -->
  <rect x="196" y="196" width="72" height="22" rx="4" fill="#052e16" stroke="#10b981" stroke-width="1"/>
  <text x="232" y="211" fill="#6ee7b7" font-size="10" font-weight="600" text-anchor="middle">Enterprise</text>
  <rect x="278" y="196" width="72" height="22" rx="4" fill="#052e16" stroke="#10b981" stroke-width="1"/>
  <text x="314" y="211" fill="#6ee7b7" font-size="10" font-weight="600" text-anchor="middle">Regulated</text>

  <!-- TRANSFORM content (TR) -->
  <text x="650" y="130" fill="#92400e" font-size="12" text-anchor="middle">Patterns: Autopilot, Persona, Sandbox</text>
  <text x="650" y="150" fill="#92400e" font-size="11" text-anchor="middle">Gates 1 + 2 cleared · Fabric-level AI</text>
  <text x="650" y="168" fill="#92400e" font-size="11" text-anchor="middle">Structural governance · Full observability</text>
  <!-- Industry tags -->
  <rect x="562" y="196" width="80" height="22" rx="4" fill="#1c1917" stroke="#f59e0b" stroke-width="1"/>
  <text x="602" y="211" fill="#fcd34d" font-size="10" font-weight="600" text-anchor="middle">SaaS mature</text>
  <rect x="652" y="196" width="78" height="22" rx="4" fill="#1c1917" stroke="#f59e0b" stroke-width="1"/>
  <text x="691" y="211" fill="#fcd34d" font-size="10" font-weight="600" text-anchor="middle">Enterprise +2yr</text>

  <!-- DANGER ZONE content (BR) -->
  <text x="650" y="326" fill="#fca5a5" font-size="24" text-anchor="middle" opacity="0.55">⚠</text>
  <text x="650" y="358" fill="#f87171" font-size="12" font-weight="600" text-anchor="middle" opacity="0.85">Ambition exceeds infrastructure</text>
  <text x="650" y="376" fill="#b45454" font-size="11" text-anchor="middle">Correct: narrow scope immediately</text>
  <text x="650" y="394" fill="#b45454" font-size="11" text-anchor="middle">Pick one Specialist pattern · Build maturity</text>
  <text x="650" y="434" fill="#7f2b2b" font-size="11" font-weight="600" text-anchor="middle">"We're building agentic AI" lives here</text>

  <!-- Gate callout box (center) -->
  <rect x="412" y="238" width="136" height="44" rx="6" fill="#02023e" stroke="#3f3f46" stroke-width="1.2"/>
  <text x="480" y="255" fill="#78716c" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="0.5">GATES 1 + 2</text>
  <text x="480" y="272" fill="#57534e" font-size="10" text-anchor="middle">required to cross →</text>
</svg>
