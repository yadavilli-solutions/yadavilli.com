<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="Inter, system-ui, sans-serif">
  <rect width="1200" height="520" fill="#09090b" rx="12"/>

  <!-- Title -->
  <text x="600" y="34" fill="#f4f4f5" font-size="17" font-weight="700" text-anchor="middle">Matched Measurement Protocol</text>
  <text x="600" y="54" fill="#52525b" font-size="12" text-anchor="middle">Choose the measurement instrument after identifying the trajectory, not before</text>

  <!--
    Column layout (1200px total):
      COL1 TRAJECTORY:      x=24  w=200  cx=124  end=224
      COL2 RIGHT MEASURE:   x=234 w=500  cx=484  text_x=250  end=734
      COL3 DETECTION SIG:   x=744 w=272  cx=880  text_x=758  end=1016
      COL4 TIMELINE:        x=1026 w=150 cx=1101  end=1176
      Right margin: 24
    Row heights: header=38  data rows=108
      Header:         y=70
      Shrinkage:      y=120  ends=228
      Profile Change: y=240  ends=348
      Replacement:    y=360  ends=468
      Note:           y=492
  -->

  <!-- HEADER ROW -->
  <rect x="24"   y="70" width="200" height="38" fill="#18181b" rx="4"/>
  <rect x="234"  y="70" width="500" height="38" fill="#18181b" rx="4"/>
  <rect x="744"  y="70" width="272" height="38" fill="#18181b" rx="4"/>
  <rect x="1026" y="70" width="150" height="38" fill="#18181b" rx="4"/>
  <text x="124"  y="94" fill="#a1a1aa" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">TRAJECTORY</text>
  <text x="484"  y="94" fill="#a1a1aa" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">RIGHT MEASUREMENT</text>
  <text x="880"  y="94" fill="#a1a1aa" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">DETECTION SIGNAL</text>
  <text x="1101" y="94" fill="#a1a1aa" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">TIMELINE</text>

  <!-- SHRINKAGE ROW  y=120 ends=228 -->
  <rect x="24"   y="120" width="200" height="108" fill="#052e16" stroke="#16a34a" stroke-width="1" rx="4"/>
  <text x="124"  y="162" fill="#4ade80" font-size="14" font-weight="700" text-anchor="middle">SHRINKAGE</text>
  <text x="124"  y="182" fill="#86efac" font-size="11" text-anchor="middle">Same work,</text>
  <text x="124"  y="198" fill="#86efac" font-size="11" text-anchor="middle">fewer people</text>

  <rect x="234"  y="120" width="500" height="108" fill="#0a1a0a" stroke="#16a34a" stroke-width="1" rx="4"/>
  <text x="250"  y="146" fill="#bbf7d0" font-size="11" font-weight="600">• Headcount per unit of output (quality-adjusted)</text>
  <text x="250"  y="164" fill="#86efac" font-size="11">• Fully-loaded cost/unit: license + labour + AI ops overhead</text>
  <text x="250"  y="182" fill="#86efac" font-size="11">• Pre-deployment baseline: minimum 8 weeks</text>
  <text x="250"  y="200" fill="#4ade80" font-size="11">• Control group: matched team without AI deployment</text>

  <rect x="744"  y="120" width="272" height="108" fill="#0a1a0a" stroke="#16a34a" stroke-width="1" rx="4"/>
  <text x="758"  y="150" fill="#bbf7d0" font-size="11">Cost per unit falls.</text>
  <text x="758"  y="170" fill="#86efac" font-size="11">Headcount stable or</text>
  <text x="758"  y="188" fill="#86efac" font-size="11">declining at renewal.</text>

  <rect x="1026" y="120" width="150" height="108" fill="#0a1a0a" stroke="#16a34a" stroke-width="1" rx="4"/>
  <text x="1101" y="150" fill="#4ade80" font-size="12" font-weight="700" text-anchor="middle">18–36</text>
  <text x="1101" y="168" fill="#4ade80" font-size="12" font-weight="700" text-anchor="middle">months</text>
  <text x="1101" y="196" fill="#86efac" font-size="10" text-anchor="middle">Headcount</text>
  <text x="1101" y="208" fill="#86efac" font-size="10" text-anchor="middle">lags tech</text>

  <!-- PROFILE CHANGE ROW  y=240 ends=348 -->
  <rect x="24"   y="240" width="200" height="108" fill="#07101a" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="124"  y="275" fill="#60a5fa" font-size="14" font-weight="700" text-anchor="middle">PROFILE</text>
  <text x="124"  y="293" fill="#60a5fa" font-size="14" font-weight="700" text-anchor="middle">CHANGE</text>
  <text x="124"  y="315" fill="#93c5fd" font-size="11" text-anchor="middle">Same headcount,</text>
  <text x="124"  y="331" fill="#93c5fd" font-size="11" text-anchor="middle">different work</text>

  <rect x="234"  y="240" width="500" height="108" fill="#07101a" stroke="#2563eb" stroke-width="1" rx="4"/>
  <text x="250"  y="266" fill="#bfdbfe" font-size="11" font-weight="600">• Time allocation studies: % routine vs judgment tasks</text>
  <text x="250"  y="284" fill="#93c5fd" font-size="11">• Task-type distribution shift: before vs 12 months after</text>
  <text x="250"  y="302" fill="#93c5fd" font-size="11">• Output-quality: complexity of work handled over time</text>
  <text x="250"  y="320" fill="#60a5fa" font-size="11">• Skills premium: are high-judgment outputs increasing?</text>

  <rect x="744"  y="240" width="272" height="108" fill="#07101a" stroke="#2563eb" stroke-width="1" rx="4"/>
  <text x="758"  y="268" fill="#bfdbfe" font-size="11">Routine work % falls.</text>
  <text x="758"  y="286" fill="#93c5fd" font-size="11">Judgment/strategy</text>
  <text x="758"  y="304" fill="#93c5fd" font-size="11">work % rises.</text>
  <text x="758"  y="322" fill="#60a5fa" font-size="11">No cost signal.</text>

  <rect x="1026" y="240" width="150" height="108" fill="#07101a" stroke="#2563eb" stroke-width="1" rx="4"/>
  <text x="1101" y="268" fill="#60a5fa" font-size="12" font-weight="700" text-anchor="middle">12–24</text>
  <text x="1101" y="286" fill="#60a5fa" font-size="12" font-weight="700" text-anchor="middle">months</text>
  <text x="1101" y="314" fill="#93c5fd" font-size="10" text-anchor="middle">Task shift</text>
  <text x="1101" y="326" fill="#93c5fd" font-size="10" text-anchor="middle">visible early</text>

  <!-- REPLACEMENT ROW  y=360 ends=468 -->
  <rect x="24"   y="360" width="200" height="108" fill="#1c0505" stroke="#dc2626" stroke-width="1.5" rx="4"/>
  <text x="124"  y="400" fill="#f87171" font-size="14" font-weight="700" text-anchor="middle">REPLACEMENT</text>
  <text x="124"  y="422" fill="#fca5a5" font-size="11" text-anchor="middle">Role eliminated,</text>
  <text x="124"  y="438" fill="#fca5a5" font-size="11" text-anchor="middle">humans removed</text>

  <rect x="234"  y="360" width="500" height="108" fill="#1c0505" stroke="#dc2626" stroke-width="1" rx="4"/>
  <text x="250"  y="386" fill="#fecaca" font-size="11" font-weight="600">• Role survival rate in target job family</text>
  <text x="250"  y="404" fill="#fca5a5" font-size="11">• Job posting volume by role type (external signal)</text>
  <text x="250"  y="422" fill="#fca5a5" font-size="11">• Org chart: headcount in role over 36 months</text>
  <text x="250"  y="440" fill="#f87171" font-size="11">• Ratio: AI output volume vs human output volume</text>

  <rect x="744"  y="360" width="272" height="108" fill="#1c0505" stroke="#dc2626" stroke-width="1" rx="4"/>
  <text x="758"  y="388" fill="#fecaca" font-size="11">Role headcount falls</text>
  <text x="758"  y="406" fill="#fca5a5" font-size="11">to zero or near-zero.</text>
  <text x="758"  y="424" fill="#fca5a5" font-size="11">Job postings decline.</text>
  <text x="758"  y="442" fill="#f87171" font-size="11">New roles emerge.</text>

  <rect x="1026" y="360" width="150" height="108" fill="#1c0505" stroke="#dc2626" stroke-width="1" rx="4"/>
  <text x="1101" y="392" fill="#f87171" font-size="12" font-weight="700" text-anchor="middle">3–7</text>
  <text x="1101" y="410" fill="#f87171" font-size="12" font-weight="700" text-anchor="middle">years</text>
  <text x="1101" y="438" fill="#fca5a5" font-size="10" text-anchor="middle">Slow-burn.</text>
  <text x="1101" y="452" fill="#fca5a5" font-size="10" text-anchor="middle">Visible late.</text>

  <!-- Bottom note -->
  <text x="600" y="494" fill="#3f3f46" font-size="11" text-anchor="middle">Applying Shrinkage metrics to a Profile Change trajectory produces a false negative every time. Identify trajectory first.</text>
</svg>
