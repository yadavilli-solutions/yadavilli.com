<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" font-family="Inter, system-ui, sans-serif">

  <!-- Background -->
  <rect width="900" height="580" fill="#09090b" rx="12"/>

  <!-- Title -->
  <text x="450" y="34" fill="#e4e4e7" font-size="15" font-weight="600" text-anchor="middle" letter-spacing="0.3">The Generating Function: Primitive Verb × Quadrant</text>
  <text x="450" y="54" fill="#71717a" font-size="11" text-anchor="middle">Patterns are viable cells, not a list. The empty cell predicts the pattern that fills it.</text>

  <!-- Column header band -->
  <rect x="210" y="86" width="158" height="40" fill="#1e1b4b" opacity="0.3"/>
  <rect x="368" y="86" width="158" height="40" fill="#052e16" opacity="0.32"/>
  <rect x="526" y="86" width="158" height="40" fill="#1c1917" opacity="0.5"/>
  <rect x="684" y="86" width="158" height="40" fill="#7f1d1d" opacity="0.22"/>

  <text x="289" y="104" fill="#a5b4fc" font-size="12" font-weight="700" text-anchor="middle">FEATURE</text>
  <text x="289" y="119" fill="#6d6a9c" font-size="9.5" text-anchor="middle">low skill · low breadth</text>
  <text x="447" y="104" fill="#6ee7b7" font-size="12" font-weight="700" text-anchor="middle">SPECIALIST</text>
  <text x="447" y="119" fill="#3d8c6e" font-size="9.5" text-anchor="middle">high skill · low breadth</text>
  <text x="605" y="104" fill="#fcd34d" font-size="12" font-weight="700" text-anchor="middle">AGENT</text>
  <text x="605" y="119" fill="#92702e" font-size="9.5" text-anchor="middle">high skill · high breadth</text>
  <text x="763" y="104" fill="#f87171" font-size="12" font-weight="700" text-anchor="middle">NOISE</text>
  <text x="763" y="119" fill="#9b4a4a" font-size="9.5" text-anchor="middle">low skill · high breadth</text>

  <!-- Verb axis label -->
  <text transform="translate(30,320) rotate(-90)" fill="#a1a1aa" font-size="12" font-weight="600" text-anchor="middle">PRIMITIVE VERB  (the hidden third axis)</text>

  <!-- ============ ROWS ============ -->
  <!-- Row geometry: first row y=132, height 48. Cell text baseline = rowTop+29 -->

  <!-- retrieve -->
  <text x="198" y="161" fill="#a1a1aa" font-size="12" font-weight="600" text-anchor="end">retrieve</text>
  <rect x="212" y="132" width="154" height="44" rx="5" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2"/>
  <text x="289" y="159" fill="#a5b4fc" font-size="12" font-weight="600" text-anchor="middle">Lookup</text>
  <rect x="370" y="132" width="154" height="44" rx="5" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="447" y="159" fill="#52525b" font-size="11" text-anchor="middle">— collapses</text>
  <rect x="528" y="132" width="154" height="44" rx="5" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="605" y="159" fill="#52525b" font-size="11" text-anchor="middle">fused →</text>
  <rect x="686" y="132" width="154" height="44" rx="5" fill="#2d0a0a" stroke="#5c2020" stroke-width="1"/>
  <text x="763" y="160" fill="#7f3030" font-size="13" text-anchor="middle">×</text>

  <!-- generate -->
  <text x="198" y="209" fill="#a1a1aa" font-size="12" font-weight="600" text-anchor="end">generate</text>
  <rect x="212" y="180" width="154" height="44" rx="5" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2"/>
  <text x="289" y="207" fill="#a5b4fc" font-size="12" font-weight="600" text-anchor="middle">Copilot</text>
  <rect x="370" y="180" width="154" height="44" rx="5" fill="#064e3b" stroke="#34d399" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="447" y="203" fill="#6ee7b7" font-size="11.5" font-weight="700" text-anchor="middle">Artifact Gen.</text>
  <text x="447" y="216" fill="#34d399" font-size="8.5" text-anchor="middle">the discovered cell</text>
  <rect x="528" y="180" width="154" height="44" rx="5" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="605" y="207" fill="#52525b" font-size="11" text-anchor="middle">fused →</text>
  <rect x="686" y="180" width="154" height="44" rx="5" fill="#2d0a0a" stroke="#5c2020" stroke-width="1"/>
  <text x="763" y="208" fill="#7f3030" font-size="13" text-anchor="middle">×</text>

  <!-- answer -->
  <text x="198" y="257" fill="#a1a1aa" font-size="12" font-weight="600" text-anchor="end">answer</text>
  <rect x="212" y="228" width="154" height="44" rx="5" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="289" y="255" fill="#52525b" font-size="11" text-anchor="middle">— needs skill</text>
  <rect x="370" y="228" width="154" height="44" rx="5" fill="#052e16" stroke="#10b981" stroke-width="1.2"/>
  <text x="447" y="255" fill="#6ee7b7" font-size="12" font-weight="600" text-anchor="middle">Oracle</text>
  <rect x="528" y="228" width="154" height="44" rx="5" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="605" y="255" fill="#52525b" font-size="11" text-anchor="middle">fused →</text>
  <rect x="686" y="228" width="154" height="44" rx="5" fill="#2d0a0a" stroke="#5c2020" stroke-width="1"/>
  <text x="763" y="256" fill="#7f3030" font-size="13" text-anchor="middle">×</text>

  <!-- monitor -->
  <text x="198" y="305" fill="#a1a1aa" font-size="12" font-weight="600" text-anchor="end">monitor</text>
  <rect x="212" y="276" width="154" height="44" rx="5" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="289" y="303" fill="#52525b" font-size="11" text-anchor="middle">—</text>
  <rect x="370" y="276" width="154" height="44" rx="5" fill="#052e16" stroke="#10b981" stroke-width="1.2"/>
  <text x="447" y="303" fill="#6ee7b7" font-size="12" font-weight="600" text-anchor="middle">Watchdog</text>
  <rect x="528" y="276" width="154" height="44" rx="5" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="605" y="303" fill="#52525b" font-size="11" text-anchor="middle">fused →</text>
  <rect x="686" y="276" width="154" height="44" rx="5" fill="#2d0a0a" stroke="#5c2020" stroke-width="1"/>
  <text x="763" y="304" fill="#7f3030" font-size="13" text-anchor="middle">×</text>

  <!-- transform -->
  <text x="198" y="353" fill="#a1a1aa" font-size="12" font-weight="600" text-anchor="end">transform</text>
  <rect x="212" y="324" width="154" height="44" rx="5" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="289" y="351" fill="#52525b" font-size="11" text-anchor="middle">—</text>
  <rect x="370" y="324" width="154" height="44" rx="5" fill="#052e16" stroke="#10b981" stroke-width="1.2"/>
  <text x="447" y="351" fill="#6ee7b7" font-size="12" font-weight="600" text-anchor="middle">Transformer</text>
  <rect x="528" y="324" width="154" height="44" rx="5" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="605" y="351" fill="#52525b" font-size="11" text-anchor="middle">fused →</text>
  <rect x="686" y="324" width="154" height="44" rx="5" fill="#2d0a0a" stroke="#5c2020" stroke-width="1"/>
  <text x="763" y="352" fill="#7f3030" font-size="13" text-anchor="middle">×</text>

  <!-- execute -->
  <text x="198" y="401" fill="#a1a1aa" font-size="12" font-weight="600" text-anchor="end">execute</text>
  <rect x="212" y="372" width="154" height="44" rx="5" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="289" y="399" fill="#52525b" font-size="11" text-anchor="middle">—</text>
  <rect x="370" y="372" width="154" height="44" rx="5" fill="#1c1917" stroke="#a16207" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="447" y="395" fill="#d4a72c" font-size="11.5" font-weight="600" text-anchor="middle">Actuator?</text>
  <text x="447" y="408" fill="#92702e" font-size="8.5" text-anchor="middle">contested 10th</text>
  <rect x="528" y="372" width="154" height="44" rx="5" fill="#1c1917" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="605" y="399" fill="#fcd34d" font-size="12" font-weight="600" text-anchor="middle">Autopilot</text>
  <rect x="686" y="372" width="154" height="44" rx="5" fill="#2d0a0a" stroke="#5c2020" stroke-width="1"/>
  <text x="763" y="400" fill="#7f3030" font-size="13" text-anchor="middle">×</text>

  <!-- converse -->
  <text x="198" y="449" fill="#a1a1aa" font-size="12" font-weight="600" text-anchor="end">converse</text>
  <rect x="212" y="420" width="154" height="44" rx="5" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="289" y="447" fill="#52525b" font-size="11" text-anchor="middle">—</text>
  <rect x="370" y="420" width="154" height="44" rx="5" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="447" y="447" fill="#52525b" font-size="11" text-anchor="middle">— not 1 turn</text>
  <rect x="528" y="420" width="154" height="44" rx="5" fill="#1c1917" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="605" y="447" fill="#fcd34d" font-size="12" font-weight="600" text-anchor="middle">Persona</text>
  <rect x="686" y="420" width="154" height="44" rx="5" fill="#2d0a0a" stroke="#5c2020" stroke-width="1"/>
  <text x="763" y="448" fill="#7f3030" font-size="13" text-anchor="middle">×</text>

  <!-- simulate -->
  <text x="198" y="497" fill="#e4e4e7" font-size="12" font-weight="700" text-anchor="end">simulate</text>
  <rect x="212" y="468" width="154" height="44" rx="5" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="289" y="495" fill="#52525b" font-size="11" text-anchor="middle">—</text>
  <rect x="370" y="468" width="154" height="44" rx="5" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="447" y="495" fill="#52525b" font-size="11" text-anchor="middle">—</text>
  <rect x="528" y="468" width="154" height="44" rx="5" fill="#1c1917" stroke="#22d3ee" stroke-width="2"/>
  <text x="605" y="491" fill="#67e8f9" font-size="12" font-weight="700" text-anchor="middle">Sandbox</text>
  <text x="605" y="504" fill="#22d3ee" font-size="8.5" text-anchor="middle">red-team break</text>
  <rect x="686" y="468" width="154" height="44" rx="5" fill="#2d0a0a" stroke="#5c2020" stroke-width="1"/>
  <text x="763" y="496" fill="#7f3030" font-size="13" text-anchor="middle">×</text>

  <!-- Footer legend -->
  <text x="450" y="544" fill="#71717a" font-size="10" text-anchor="middle">8 verbs × 2 skill × 2 breadth = 32 raw cells  →  4 prune rules  →  9 viable patterns</text>
  <text x="450" y="562" fill="#52525b" font-size="9.5" text-anchor="middle">green = shipping pattern · dashed green = derived from empty cell · cyan = new verb forced by red team · amber dashed = contested · ✕ = Noise (pruned)</text>
</svg>
