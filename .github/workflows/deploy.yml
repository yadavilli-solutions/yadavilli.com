name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy-cloudflare:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.161.1'

      - name: Build
        run: hugo --minify

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Post new Insights articles to Substack
        if: success()
        run: >
          uv run --with python-frontmatter --with markdown --with requests
          python scripts/post-to-substack.py
        env:
          SUBSTACK_SESSION_COOKIE: ${{ secrets.SUBSTACK_SESSION_COOKIE }}

  deploy-aws:
    runs-on: ubuntu-latest
    # Only runs once the AWS target is configured; without the variables the
    # job would fail on every push.
    if: vars.AWS_S3_BUCKET != ''
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.161.1'

      - name: Build
        run: hugo --baseURL "https://${{ vars.AWS_SITE_DOMAIN }}/" --minify

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Sync to S3
        # Insights is password-gated by the Cloudflare Worker; CloudFront has no
        # equivalent check, so the section never reaches the bucket.
        run: aws s3 sync public/ "s3://${{ vars.AWS_S3_BUCKET }}" --delete --exclude "insights/*"

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"
